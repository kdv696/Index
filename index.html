/* ===== ROUTER ===== */
function route(){
  const hash = location.hash;
  const pMatch = hash.match(/^#\/project\/(\d+)$/);
  const cMatch = hash.match(/^#\/category\/([a-z_]+)$/);
  const oMatch = hash.match(/^#\/owner\/([^/]+)$/);
  const tMatch = hash.match(/^#\/tab\/([a-z]+)$/);

  if(pMatch){
    const project = DATA.find(p=>p.id === parseInt(pMatch[1]));
    if(project){ renderDetail(project); renderBottomNav(currentRootTab); document.getElementById('appScroll').scrollTo(0,0); return; }
  }
  if(cMatch){ currentRootTab='categories'; renderCategoryList(cMatch[1]); renderBottomNav('categories'); document.getElementById('appScroll').scrollTo(0,0); return; }
  if(oMatch){ currentRootTab='categories'; renderOwnerList(oMatch[1]); renderBottomNav('categories'); document.getElementById('appScroll').scrollTo(0,0); return; }
  if(hash === '#/owners'){ currentRootTab='categories'; renderOwnerGrid(); renderBottomNav('categories'); document.getElementById('appScroll').scrollTo(0,0); return; }
  if(tMatch && ROOT_TABS.find(t=>t.key===tMatch[1])){
    currentRootTab = tMatch[1];
    if(currentRootTab==='home') renderHome();
    else if(currentRootTab==='categories') renderCategoryGrid();
    else if(currentRootTab==='analytics') renderAnalytics();
    else if(currentRootTab==='more') renderMore();
    renderBottomNav(currentRootTab);
    document.getElementById('appScroll').scrollTo(0,0);
    return;
  }
  currentRootTab='home'; renderHome(); renderBottomNav('home');
}

window.addEventListener('hashchange', route);

/* Данные подтягиваются при запуске и при возврате к приложению. */
/* ---------- положение нижнего меню ----------
   В Safari меню должно стоять над нижней панелью браузера, иначе та его
   закроет, — там хватает обычной привязки. В приложении с главного экрана
   панели браузера нет, и меню опускается к полоске «домой». Режим
   определяется при запуске, высота берётся фактическая. */
function isStandalone(){
  return !!(window.navigator.standalone ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
}
function cssVar(name){
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
}
/* ---------- высота страницы в режиме приложения ----------
   Ошибка iOS 26: в приложении с главного экрана, когда шапка растянута под
   строку состояния, система занижает высоту окна ровно на верхнюю безопасную
   зону. 100%, 100dvh, innerHeight — все короче экрана; честную высоту отдаёт
   только 100lvh. Стили ставят её странице, а если браузер эту единицу
   не знает, страница дотягивается до высоты экрана здесь. */
function viewportFix(){
  if (!isStandalone() || window.innerWidth >= 760) return 0;
  const sat = cssVar('--sat');
  const screenH = (window.screen && window.screen.height) || 0;
  const missing = screenH - window.innerHeight;
  return (sat > 0 && Math.abs(missing - sat) <= 3) ? Math.round(sat) : 0;
}
function fitShell(){
  const root = document.documentElement;
  if (!isStandalone() || window.innerWidth >= 760 || window.innerWidth > window.innerHeight){
    root.style.height = '';
    return;
  }
  root.style.height = '';
  const want = (window.screen && window.screen.height) || 0;
  const got = root.getBoundingClientRect().height;
  if (want && got < want - 3) root.style.height = want + 'px';
}
function shellHeight(){ return Math.round(document.documentElement.getBoundingClientRect().height); }

if (isStandalone()) document.documentElement.classList.add('standalone');
window.addEventListener('resize', fitShell);
window.addEventListener('pageshow', fitShell);
window.addEventListener('load', function(){ fitShell(); setTimeout(fitShell, 400); });
window.addEventListener('orientationchange', function(){ setTimeout(fitShell, 250); });
fitShell();

window.startSync = async function(){
  try{ API_KEY = localStorage.getItem('kmm_api_key') || ''; }catch(e){}
  if (await pullData(false)) rerenderCurrent();
};

(async function initSync(){
  if (!API_URL || !API_KEY) return;
  await pullData(false);
  route();
  rerenderCurrent();
  /* Приложение, запущенное с главного экрана, не всегда сообщает о возврате
     одним и тем же событием, поэтому слушаем все три и не даём им сработать
     чаще раза в пять секунд. */
  let lastRefresh = Date.now();
  const refresh = function(){
    if (Date.now() - lastRefresh < 5000) return;
    lastRefresh = Date.now();
    pullData(true).then(function(ok){ if (ok) rerenderCurrent(); });
  };
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); });
  window.addEventListener('pageshow', refresh);
  window.addEventListener('focus', refresh);
  window.manualRefresh = function(){ lastRefresh = 0; refresh(); };

  /* ---------- жест «потянуть вниз» ---------- */
  const scroller = document.getElementById('appScroll');
  const ptr = document.getElementById('ptr');
  /* К высоте раскрытия прибавляем безопасную зону: иначе кружок окажется
     под вырезом или островком, где его не видно. */
  const SAT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  const OPEN = 52 + SAT, TRIGGER = 58 + SAT, MAX = 100 + SAT;
  let startY = 0, pulling = false, busy = false;

  function setHeight(px){ ptr.style.height = px + 'px'; }

  async function runRefresh(){
    if (busy) return;
    busy = true;
    ptr.classList.remove('drag');
    ptr.classList.add('ready', 'spin');
    setHeight(OPEN);
    lastRefresh = 0;
    const ok = await pullData(true);
    if (ok) rerenderCurrent();
    /* Небольшая задержка: мгновенное схлопывание читается как сбой. */
    setTimeout(function(){
      setHeight(0);
      ptr.classList.remove('spin');
      setTimeout(function(){ ptr.classList.remove('ready'); busy = false; }, 300);
    }, ok ? 420 : 900);
  }

  scroller.addEventListener('touchstart', function(e){
    if (busy || scroller.scrollTop > 0) { pulling = false; return; }
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive: true });

  scroller.addEventListener('touchmove', function(e){
    if (!pulling || busy) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0){ ptr.classList.remove('drag','ready'); setHeight(0); return; }
    /* Сопротивление: чем дальше тянут, тем медленнее идёт. */
    const d = Math.min(MAX, dy * 0.55);
    ptr.classList.add('drag');
    setHeight(d);
    ptr.classList.toggle('ready', d > 24);
    if (d > 6 && e.cancelable) e.preventDefault();
  }, { passive: false });

  scroller.addEventListener('touchend', function(){
    if (!pulling || busy) return;
    pulling = false;
    const h = parseFloat(ptr.style.height) || 0;
    ptr.classList.remove('drag');
    if (h >= TRIGGER) runRefresh();
    else { setHeight(0); setTimeout(function(){ ptr.classList.remove('ready'); }, 300); }
  });

  /* Повторное нажатие на активную вкладку — тот же индикатор, тот же результат. */
  window.manualRefresh = runRefresh;
})();

(function initAppearance(){
  let savedMode = null, savedTheme = null;
  try{ savedMode = localStorage.getItem('kmm_mode'); savedTheme = localStorage.getItem('kmm_theme'); }catch(e){}
  if(!savedMode){
    savedMode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  currentMode = savedMode;
  document.documentElement.setAttribute('data-theme', currentMode);
  if(savedTheme && THEMES.find(t=>t.key===savedTheme)) activeTheme = savedTheme;
  const t = THEMES.find(x=>x.key===activeTheme) || THEMES[0];
  const accent = (currentMode==='dark' && t.accentDark) ? t.accentDark : t.accent;
  const tint = currentMode==='dark' ? hexToRgba(accent, 0.16) : t.tint;
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-tint', tint);
})();

/* ===== INIT: restore previously imported Excel data, if any ===== */
(function initData(){
  try{
    const saved = localStorage.getItem('kmm_data');
    const savedAt = localStorage.getItem('kmm_data_imported_at');
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length){
        DATA = parsed;
        dataSource = 'imported';
        dataImportedAt = savedAt || null;
      }
    }
  }catch(e){}
})();

route();
</script>
