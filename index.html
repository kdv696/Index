<title>Портфель автоматизации · КММ</title>
<style>
:root{
  --bg: #FBFBFC;
  --panel: #F4F6F8;
  --panel-2: #EBEEF1;
  --card-bg: #FFFFFF;
  --border: #E4E8EC;
  --border-strong:#D4DAE0;
  --ink: #14212C;
  --ink-2: #46535E;
  --ink-muted: #6C7883;
  --ink-faint: #9AA5AF;
  --navy: #0E3A5C;
  --navy-2: #0A2B44;
  --heading: #0E3A5C;
  --accent: #B5642A;
  --accent-tint: #FBF0E5;
  --green: #1E8A5D;   --green-tint: #E7F5EE;
  --amber: #BC7E1F;   --amber-tint: #FBF2DE;
  --blue:  #3C6FA0;   --blue-tint:  #EAF1F8;
  --red:   #C1442E;   --red-tint:   #FBEAE6;
  --radius: 14px;
  --radius-sm: 9px;
  --radius-xs: 6px;
  --shadow-sm: 0 1px 2px rgba(16,40,62,0.05);
  --shadow-md: 0 6px 20px -6px rgba(16,40,62,0.16);
  --shadow-lg: 0 18px 40px -12px rgba(16,40,62,0.22);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);

  /* ===== TYPE SCALE (unified) ===== */
  --f-display: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  --f-body: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  --f-mono: ui-monospace, 'SF Mono', 'Space Mono', monospace;
}

/* ===== DARK MODE ===== */
html[data-theme="dark"]{
  --bg: #0F1417;
  --panel: #171D21;
  --panel-2: #1D242A;
  --card-bg: #1A2126;
  --border: #262E34;
  --border-strong: #3A444C;
  --ink: #EDEFF1;
  --ink-2: #C6CCD2;
  --ink-muted: #8D98A1;
  --ink-faint: #5E6970;
  --heading: #74A9DA;
  --green-tint: rgba(30,138,93,0.16);
  --amber-tint: rgba(188,126,31,0.18);
  --blue-tint: rgba(60,111,160,0.20);
  --red-tint: rgba(193,68,46,0.18);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.24);
  --shadow-md: 0 6px 20px -6px rgba(0,0,0,0.4);
  --shadow-lg: 0 18px 40px -12px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; height:100%; }
body{ background: var(--bg); color: var(--ink); font-family: var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  position:fixed; inset:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; -webkit-overflow-scrolling:auto;
  transition: background-color .25s ease, color .25s ease; }

/* ===== SHARED TYPE CLASSES — equivalent things look identical everywhere ===== */
.t-hero-num{ font-family:var(--f-display); font-weight:600; font-size:26px; letter-spacing:-0.02em; fill:#fff; font-variant-numeric: tabular-nums; }
.t-h1{ font-family:var(--f-display); font-weight:600; font-size:21px; letter-spacing:-0.015em; line-height:1.2; }
.t-section{ font-family:var(--f-display); font-weight:600; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; }
.t-card-title{ font-family:var(--f-display); font-weight:600; font-size:15.5px; letter-spacing:-0.01em; line-height:1.3; color:var(--ink); text-wrap: balance; }
.t-body{ font-family:var(--f-body); font-weight:400; font-size:13.5px; line-height:1.6; color:var(--ink-2); }
.t-label{ font-family:var(--f-body); font-weight:600; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); }
.t-code{ font-family:var(--f-mono); font-weight:400; font-size:11px; letter-spacing:-0.02em; color:var(--ink-faint); }
.t-num{ font-family:var(--f-display); font-weight:700; font-size:22px; letter-spacing:-0.02em; }
.t-btn{ font-family:var(--f-body); font-weight:600; font-size:13px; letter-spacing:0; }
.pill{
  flex-shrink:0; font-family:var(--f-body); font-weight:600; font-size:11px; letter-spacing:0.01em;
  padding: 3px 10px; border-radius: 20px; white-space:nowrap; line-height:1.5;
  transition: color .2s ease, background-color .2s ease;
}
.pill.s-completed{ color: var(--green); background: var(--green-tint); }
.pill.s-inprogress{ color: var(--accent); background: var(--accent-tint); }
.pill.s-notstarted{ color: var(--amber); background: var(--amber-tint); }
.pill.s-accepted{ color: var(--blue); background: var(--blue-tint); }

/* ===================== DEVICE FRAME ===================== */
.stage{ min-height: 100vh; min-height: 100svh; min-height: 100dvh; }
.iphone{ position: relative; width: 100%; height: 100vh; height: 100svh; height: 100dvh; background: var(--bg); overflow: hidden; }
.iphone-screen{ position: relative; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; -webkit-mask-image: -webkit-radial-gradient(white, black); }

@media (min-width: 760px){
  body{ background:
      radial-gradient(1200px 600px at 50% -10%, #EEF2F6 0%, #E6EBF0 55%, #E1E7EC 100%); }
  .stage{ display:flex; align-items:center; justify-content:center; padding:0 20px; height:100vh; height:100svh; min-height:0; overflow:hidden; }
  .stage::before{
    content: 'Предпросмотр — так это выглядит на iPhone';
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    font-family:var(--f-body); font-weight:500; font-size: 12px; color: #8A95A1; letter-spacing: .02em;
  }
  .iphone{ width: 393px; height: 852px; flex-shrink:0;
    transform: scale(var(--mockup-scale, 1)); transform-origin: center center;
    background: #0A0A0C; border-radius: 62px; padding: 13px;
    box-shadow: 0 50px 90px -20px rgba(10,25,40,0.40), 0 8px 24px rgba(10,25,40,0.18), inset 0 0 0 2px #232326; }
  .iphone::before{ content:''; position:absolute; right:-3px; top: 205px; width:3px; height:78px; background:#0A0A0C; border-radius: 0 3px 3px 0; }
  .iphone::after{ content:''; position:absolute; left:-3px; top:172px; width:3px; height:48px; background:#0A0A0C; border-radius: 3px 0 0 3px; box-shadow: 0 74px 0 0 #0A0A0C; }
  .iphone-screen{ border-radius: 49px; }
  header.topbar{ }
  .dynamic-island{ display:block; }
  .status-bar{ display:flex; }
  .home-indicator{ display:block; }
}
.dynamic-island{ display:none; position:absolute; top:11px; left:50%; transform:translateX(-50%); width:116px; height:33px; background:#000; border-radius:20px; z-index:60; }
.status-bar{ display:none; flex-shrink:0; height:46px; background:var(--navy); align-items:flex-end; justify-content:space-between; padding: 0 27px 8px; color:#fff; position:relative; z-index:10; }
.status-bar .time{ font-family:var(--f-body); font-weight:700; font-size:14.5px; letter-spacing:.01em; }
.status-bar .icons{ display:flex; align-items:center; gap:6px; }
.status-bar svg{ display:block; }

/* ===================== APP SHELL ===================== */
.app-scroll{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; }
.app-scroll::-webkit-scrollbar{ width:0; }

header.topbar{ position: sticky; top:0; z-index: 30;
  background: rgba(14,58,92,0.66);
  background-image: linear-gradient(160deg, rgba(18,68,103,0.7) 0%, rgba(14,58,92,0.66) 46%, rgba(10,43,68,0.7) 100%);
  backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  padding-top: var(--sat); overflow:hidden; }
.topbar .contour{ position:absolute; inset:0; width:100%; height:100%; opacity:0.5; pointer-events:none; }
.topbar-inner{ position:relative; z-index:2; padding: 15px 22px 15px; }
.crumb-row{ display:flex; align-items:center; gap:6px; min-height: 20px; margin-bottom: 9px; }
.back{ display:none; align-items:center; gap:5px; color: rgba(255,255,255,0.78); font-family:var(--f-body); font-weight:600; font-size:13px; cursor:pointer; background:rgba(255,255,255,0.08); border:none; padding:5px 11px 5px 8px; border-radius:20px; transition: background .15s ease; }
.back:active{ background:rgba(255,255,255,0.16); }
.back.show{ display:inline-flex; }
.back svg{ width:15px; height:15px; }
.eyebrow{ font-family:var(--f-mono); font-weight:400; font-size: 10.5px; letter-spacing: 0.14em; color: rgba(255,255,255,0.52); text-transform: uppercase; margin: 0 0 4px; }
.topbar-logo{ position:absolute; top:15px; right:22px; height:24px; width:auto; opacity:0.96; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2)); }
.home-logo-row{ display:flex; justify-content:center; margin-bottom:12px; }
.home-logo-img{ display:block; height:34px; width:auto; }
h1.title{ color:#fff; margin:0; text-shadow: 0 1px 8px rgba(0,0,0,0.18); text-wrap: balance; }
.brand-strip{ position:relative; z-index:2; height:12px; margin-top:-1px;
  background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
  opacity: 0.55; transition: background .25s ease; pointer-events:none; }

/* view + transition */
.view{ padding: 20px 18px 110px; animation: viewIn .32s cubic-bezier(.2,.7,.3,1); }
@keyframes viewIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:none; } }

/* ===================== HOME: HERO ===================== */
.hero{ position:relative; border-radius: var(--radius); padding: 20px; margin-bottom: 16px; overflow:hidden;
  background: linear-gradient(150deg, #124467 0%, #0E3A5C 55%, #0A2B44 100%);
  box-shadow: var(--shadow-md); }
.hero .contour{ position:absolute; inset:0; width:100%; height:100%; opacity:0.55; pointer-events:none; }
.hero-row{ position:relative; z-index:2; display:flex; align-items:center; gap:18px; }
.hero-ring{ flex-shrink:0; width:96px; height:96px; }
.hero-ring .track{ stroke:rgba(255,255,255,0.14); }
.hero-ring .prog{ stroke: var(--accent); transition: stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1); }
.hero-text{ flex:1; }
.hero-eyebrow{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:6px; }
.hero-title{ font-family:var(--f-display); font-weight:600; font-size:17px; letter-spacing:-0.01em; color:#fff; line-height:1.28; margin-bottom:6px; text-wrap: balance; }
.hero-meta{ font-family:var(--f-body); font-weight:500; font-size:12px; color:rgba(255,255,255,0.62); }

/* ===================== STATUS DISTRIBUTION BAR ===================== */
.dist{ margin-bottom: 24px; }
.dist-bar{ display:flex; height:12px; border-radius:20px; overflow:hidden; background:var(--panel-2); box-shadow: var(--shadow-sm); }
.dist-seg{ height:100%; width:0; transition: width 1s cubic-bezier(.3,.8,.3,1); }
.dist-seg.s-completed{ background: var(--green); }
.dist-seg.s-inprogress{ background: var(--accent); }
.dist-seg.s-notstarted{ background: var(--amber); }
.dist-seg.s-accepted{ background: var(--blue); }
.dist-legend{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-top:14px; }
.legend-item{ display:flex; align-items:center; gap:8px; }
.legend-dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
.legend-dot.s-completed{ background:var(--green); } .legend-dot.s-inprogress{ background:var(--accent); }
.legend-dot.s-notstarted{ background:var(--amber); } .legend-dot.s-accepted{ background:var(--blue); }
.legend-label{ font-family:var(--f-body); font-weight:500; font-size:12px; color:var(--ink-2); flex:1; }
.legend-val{ font-family:var(--f-mono); font-size:12px; color:var(--ink); }

/* ===================== KPI GRID ===================== */
.kpi-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin-bottom: 22px; }
.kpi-tile{ padding: 12px 6px; text-align:center; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.kpi-num{ font-family:var(--f-display); font-size:19px; font-weight:700; letter-spacing:-0.02em; color: var(--heading); font-variant-numeric: tabular-nums; }
.kpi-lbl{ font-family:var(--f-body); font-size:8.6px; color:var(--ink-muted); letter-spacing:.02em; text-transform:uppercase; margin-top:3px; font-weight:600; line-height:1.3; }
.kpi-tile.k-risk .kpi-num{ color: var(--red); }
.kpi-tile.k-ontime .kpi-num{ color: var(--green); }
.kpi-tile.k-delay .kpi-num{ color: var(--amber); }

/* ===== RISK BADGES ===== */
.risk-badge{ display:inline-flex; align-items:center; gap:6px; font-family:var(--f-body); font-weight:600; font-size:11px; padding:3px 10px 3px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.risk-badge .dot{ width:7px; height:7px; border-radius:50%; }
.risk-low{ background:var(--green-tint); color:var(--green); } .risk-low .dot{ background:var(--green); }
.risk-medium{ background:var(--amber-tint); color:var(--amber); } .risk-medium .dot{ background:var(--amber); }
.risk-high{ background:var(--red-tint); color:var(--red); } .risk-high .dot{ background:var(--red); }
.risk-chip-sm{ font-family:var(--f-mono); font-size:9.5px; font-weight:400; padding:2px 7px; border-radius:10px; display:inline-flex; align-items:center; gap:4px; margin-top:7px; }
.risk-chip-sm.risk-medium{ background:var(--amber-tint); color:var(--amber); }
.risk-chip-sm.risk-high{ background:var(--red-tint); color:var(--red); }

/* ===== ATTENTION NEEDED ===== */
.attn-list{ display:flex; flex-direction:column; gap:9px; margin-bottom:8px; }
.attn-card{ background:var(--card-bg); border:1px solid var(--red-tint); border-left:3px solid var(--red); border-radius: var(--radius-sm); padding: 13px 14px; cursor:pointer; box-shadow:var(--shadow-sm); transition: transform .12s ease, box-shadow .18s ease; }
.attn-card:active{ transform: scale(.985); }
.attn-card:hover{ box-shadow:var(--shadow-md); }
.attn-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.attn-reasons{ margin-top:8px; display:flex; flex-direction:column; gap:4px; }
.attn-reason{ display:flex; align-items:flex-start; gap:6px; font-family:var(--f-body); font-size:11.5px; color:var(--ink-2); line-height:1.5; }
.attn-reason::before{ content:'—'; color:var(--red); flex-shrink:0; }
.attn-clear{ display:flex; align-items:center; gap:10px; background:var(--green-tint); border:1px solid var(--green); border-radius:var(--radius-sm); padding:12px 14px; }
.attn-clear svg{ width:18px; height:18px; color:var(--green); flex-shrink:0; }
.attn-clear p{ margin:0; font-family:var(--f-body); font-size:12.5px; color:var(--green); line-height:1.5; }

/* ===== DEVIATION CHIP (plan vs actual) ===== */
.dev-chip{ font-family:var(--f-mono); font-size:10.5px; font-weight:400; padding:2px 8px; border-radius:10px; display:inline-flex; align-items:center; gap:3px; }
.dev-ontime{ background:var(--green-tint); color:var(--green); }
.dev-late{ background:var(--amber-tint); color:var(--amber); }
.dev-late-bad{ background:var(--red-tint); color:var(--red); }

/* ===== QUICK CONTACT (in project overview) ===== */
.quick-contact{ display:flex; align-items:center; gap:12px; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; margin-top:12px; box-shadow:var(--shadow-sm); }
.quick-contact-avatar{ flex-shrink:0; width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#0E3A5C,#3C6FA0); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:700; font-size:13.5px; }
.quick-contact-info{ flex:1; min-width:0; }
.quick-contact-name{ font-family:var(--f-body); font-weight:600; font-size:13px; color:var(--ink); }
.quick-contact-role{ font-family:var(--f-body); font-size:11px; color:var(--ink-faint); margin-top:1px; }

/* ===================== ПОТЯНУТЬ ДЛЯ ОБНОВЛЕНИЯ =====================
   Индикатор живёт внутри прокручиваемой области и появляется ниже выреза
   и островка — поэтому перекрыть его нечем. */
.ptr{ height:0; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;
  flex-shrink:0; transition: height .30s cubic-bezier(.22,.9,.3,1); }
.ptr.drag{ transition:none; }
.ptr-in{ width:30px; height:30px; margin-bottom:10px; border-radius:50%;
  background:var(--card-bg); box-shadow:0 3px 10px -2px rgba(16,40,62,.22);
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); opacity:0; transform:scale(.7); transition:opacity .16s, transform .16s; }
.ptr-in svg{ width:16px; height:16px; }
.ptr.ready .ptr-in{ opacity:1; transform:scale(1); }
.ptr.spin .ptr-in svg{ animation: ptrSpin .75s linear infinite; }
@keyframes ptrSpin{ to{ transform: rotate(360deg); } }
@media (prefers-reduced-motion:reduce){ .ptr{ transition:none; } .ptr.spin .ptr-in svg{ animation:none; } }

/* ===================== СВЯЗЬ И ОБЩЕНИЕ ===================== */
.sync{ position:fixed; left:50%; transform:translateX(-50%); top:calc(8px + var(--sat)); z-index:120;
  display:flex; align-items:center; gap:7px; padding:6px 13px; border-radius:20px;
  background:rgba(20,33,44,.9); color:#fff; font-size:11.5px; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s; white-space:nowrap; }
.sync.on{ opacity:1; }
.sync.err{ background:var(--red); }
.sync-dot{ width:7px; height:7px; border-radius:50%; background:#fff; animation:syncPulse 1.1s infinite ease-in-out; }
@keyframes syncPulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

.pp-facts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pp-fact{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-xs); padding:10px 11px; min-width:0; }
.pp-fact-l{ font-size:9.5px; letter-spacing:.08em; margin-bottom:5px; }
.pp-fact-v{ font-size:17px; font-weight:700; color:var(--heading); letter-spacing:-.02em; line-height:1.15; word-break:break-word; }
.pp-fact-s{ font-size:11px; color:var(--ink-muted); margin-top:3px; line-height:1.35; }
.pp-fact.good .pp-fact-v{ color:var(--green); }
.pp-fact.warn .pp-fact-v{ color:var(--amber); }
.pp-fact.bad  .pp-fact-v{ color:var(--red); }
.pp-src{ margin:9px 0 0; font-size:11px; color:var(--ink-faint); }
.pp-kpi .kpi-metric + .kpi-metric{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
.effect-auto{ display:inline-block; margin-left:6px; padding:1px 7px; border-radius:20px;
  background:var(--panel-2); color:var(--ink-muted); font-size:10px; font-weight:700;
  letter-spacing:.02em; vertical-align:1px; }
.ms-back{ position:absolute; inset:0; background:rgba(14,26,38,.42);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:60; }
.ms-back.on, .ms-back.closing{ pointer-events:auto; }
.ms-back.on{ opacity:1; }
.ms{ position:absolute; left:0; right:0; bottom:0; z-index:61;
  background:var(--card-bg); border-radius:20px 20px 0 0;
  box-shadow:0 -14px 40px -12px rgba(16,40,62,.28);
  transform:translateY(102%); transition:transform .3s cubic-bezier(.22,.9,.3,1);
  max-height:76%; display:flex; flex-direction:column; padding-bottom:calc(14px + var(--sab)); }
.ms.on{ transform:translateY(0); }
.ms-grip{ width:38px; height:4px; border-radius:4px; background:var(--border-strong); margin:9px auto 4px; flex-shrink:0; }
.ms-head{ padding:6px 18px 12px; flex-shrink:0; }
.ms-title{ color:var(--heading); font-size:16px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
.ms-sub{ font-size:12px; color:var(--ink-muted); margin-top:4px; line-height:1.4; }
.ms-list{ overflow-y:auto; padding:0 12px 6px; -webkit-overflow-scrolling:touch; }
.ms-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:12px; border:none; background:transparent; border-radius:12px; cursor:pointer;
  transition:background .14s; text-decoration:none; color:inherit; -webkit-tap-highlight-color:transparent; }
.ms-item:active{ background:var(--panel-2); }
.ms-item + .ms-item{ box-shadow:inset 0 1px 0 var(--border); }
.ms-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.ms-body{ flex:1; min-width:0; }
.ms-name{ font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.35; display:block; }
.ms-meta{ font-size:11.5px; color:var(--ink-muted); margin-top:3px; line-height:1.35; display:block; }
.ms-arrow{ width:16px; height:16px; color:var(--ink-faint); flex-shrink:0; }
.ms-all{ background:var(--accent-tint); }
.ms-all .ms-name{ color:var(--accent); }
.ms-foot{ padding:10px 18px 2px; flex-shrink:0; }
.ms-cancel{ width:100%; padding:12px; border:none; border-radius:12px; background:var(--panel-2);
  color:var(--ink-2); font-family:var(--f-body); font-size:13.5px; font-weight:600; cursor:pointer; }

.quick-contact-acts{ display:flex; gap:7px; flex-shrink:0; }
.quick-contact-btn.wa{ background:var(--green); }
.contact-btn.wa{ background:var(--green-tint); color:var(--green); border:none; }
.contact-btn.wa svg{ fill:currentColor; stroke:none; }
.tl-mail, .tl-wa{ text-decoration:none; -webkit-tap-highlight-color:transparent;
  flex-shrink:0; width:26px; height:26px; border-radius:8px; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0; }
.tl-mail{ background:var(--panel-2); color:var(--ink-muted); }
.tl-mail:active{ background:var(--border); color:var(--heading); }
.tl-wa{ background:var(--green-tint); color:var(--green); }
.tl-wa:active{ filter:brightness(.94); }
.tl-mail svg{ width:13px; height:13px; }
.tl-wa svg{ width:14px; height:14px; fill:currentColor; }

.status-edit{ cursor:pointer; position:relative; padding-right:19px; }
.status-edit::after{ content:''; position:absolute; right:7px; top:50%; width:5px; height:5px;
  border-right:1.6px solid currentColor; border-bottom:1.6px solid currentColor;
  transform:translateY(-70%) rotate(45deg); opacity:.65; }

.cm-wrap{ margin-top:9px; padding-top:9px; border-top:1px dashed var(--border); }
.cm-item{ display:flex; gap:9px; padding:7px 0; align-items:flex-start; }
.cm-av{ width:24px; height:24px; border-radius:50%; flex-shrink:0; background:var(--panel-2);
  color:var(--ink-muted); font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.cm-body{ flex:1; min-width:0; }
.cm-head{ font-size:10.5px; color:var(--ink-faint); display:flex; gap:7px; flex-wrap:wrap; }
.cm-text{ font-size:12px; color:var(--ink-2); line-height:1.45; margin-top:2px; word-break:break-word; }
.cm-del{ flex-shrink:0; width:22px; height:22px; border:none; background:none; padding:0;
  color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
  border-radius:6px; opacity:.55; }
.cm-del:active{ background:var(--panel-2); color:var(--red); opacity:1; }
.cm-del svg{ width:13px; height:13px; }
.cm-item.cm-pending{ opacity:.55; }
.cm-add{ display:flex; gap:7px; margin-top:8px; }
.cm-add input{ flex:1; min-width:0; font-family:var(--f-body); font-size:12px; padding:8px 10px;
  border:1px solid var(--border); border-radius:9px; background:var(--panel); color:var(--ink); }
.cm-add input:focus{ outline:none; border-color:var(--accent); background:var(--card-bg); }
.cm-send{ flex-shrink:0; width:34px; border:none; border-radius:9px; background:var(--heading);
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.cm-send svg{ width:15px; height:15px; }
@media (prefers-reduced-motion:reduce){ .ms,.ms-back,.sync{ transition:none; } }

.quick-contact-btn{ flex-shrink:0; width:36px; height:36px; border-radius:10px; background:var(--heading); color:#fff; display:flex; align-items:center; justify-content:center; text-decoration:none; }
.quick-contact-btn svg{ width:16px; height:16px; }

/* ===================== SECTION HEAD ===================== */
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 13px; }
.section-name{ color: var(--heading); }
.section-count{ font-family:var(--f-mono); font-size:10.5px; color: var(--ink-faint); }

/* ===================== NEWS FEED ===================== */
.feed-list{ display:flex; flex-direction:column; gap:9px; }
.feed-item{ display:flex; gap:13px; background:var(--card-bg); border:1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; cursor:pointer; box-shadow:var(--shadow-sm); transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease; }
.feed-item:active{ transform: scale(.985); }
.feed-item:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md); }
.feed-rail{ position:relative; flex-shrink:0; width:14px; display:flex; justify-content:center; padding-top:3px; }
.feed-node{ width:12px; height:12px; border-radius:50%; border:3px solid; background:var(--card-bg); z-index:1; }
.feed-node.s-completed{ border-color:var(--green); } .feed-node.s-inprogress{ border-color:var(--accent); }
.feed-node.s-notstarted{ border-color:var(--amber); } .feed-node.s-accepted{ border-color:var(--blue); }
.feed-body{ flex:1; min-width:0; }
.feed-proj{ margin-bottom:4px; }
.feed-name{ margin-bottom:8px; }
.feed-meta{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.feed-date{ font-family:var(--f-mono); font-size:11px; color: var(--ink-faint); }

/* ===================== CATEGORY GRID ===================== */
.tab-intro{ margin: 0 0 18px; }
.cat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
.cat-tile{ position:relative; background:var(--card-bg); border:1px solid var(--border); border-radius: var(--radius); padding: 16px 15px 15px; cursor:pointer; box-shadow:var(--shadow-sm); transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease; overflow:hidden; }
.cat-tile:active{ transform: scale(.98); }
.cat-tile:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md); }
.cat-tile::after{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--cat-color, var(--heading)); }
.cat-icon-wrap{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:13px; background:var(--cat-tint, var(--panel)); }
.cat-icon{ width:20px; height:20px; color: var(--cat-color, var(--heading)); }
.cat-tile-title{ margin-bottom:12px; min-height:40px; }
.cat-tile-foot{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.cat-tile-count{ font-family:var(--f-mono); font-size:10.5px; color:var(--ink-faint); }
.cat-tile-pct{ font-family:var(--f-display); font-weight:700; font-size:14px; letter-spacing:-0.02em; color:var(--cat-color, var(--heading)); font-variant-numeric: tabular-nums; }
.cat-mini{ height:4px; border-radius:3px; background:var(--panel-2); overflow:hidden; }
.cat-mini-fill{ height:100%; width:0; border-radius:3px; background:var(--cat-color, var(--heading)); transition: width .9s cubic-bezier(.3,.8,.3,1); }

/* ===================== LEDGER LIST ===================== */
.ledger{ display:flex; flex-direction:column; gap:11px; }
.entry{ background:var(--card-bg); border:1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; cursor:pointer; box-shadow:var(--shadow-sm); transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease; }
.entry:active{ transform: scale(.99); }
.entry:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md); }
.entry-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.tl-top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 9px; }
.tl-top .tl-name{ flex:1 1 100%; min-width:0; }
.tl-top .pill{ flex-shrink:0; margin-right:auto; }
.entry-id{ margin-bottom:3px; }
.progress-row{ display:flex; align-items:center; gap:10px; margin-top:13px; }
.progress-track{ flex:1; height:6px; background: var(--panel-2); border-radius:4px; overflow:hidden; }
.progress-fill{ height:100%; width:0; border-radius:4px; transition: width .9s cubic-bezier(.3,.8,.3,1); }
.progress-pct{ font-family:var(--f-mono); font-size:11px; color: var(--ink-muted); min-width:34px; text-align:right; }

/* ===================== DETAIL ===================== */
.detail-card{ position:relative; background:var(--card-bg); border:1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 16px; margin-bottom: 18px; box-shadow:var(--shadow-sm); overflow:hidden; }
.detail-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent); }
.detail-id{ margin-bottom:6px; }
.detail-title{ font-family:var(--f-display); font-weight:600; font-size:19px; letter-spacing:-0.015em; line-height:1.26; color:var(--ink); margin:0; }
.detail-sub{ margin-top:8px; }
.detail-foot{ display:flex; align-items:center; gap:12px; margin-top:14px; }
.detail-foot .progress-row{ flex:1; margin-top:0; }

.tabs{ display:flex; gap:0; margin-bottom: 18px; border-bottom: 1.5px solid var(--border); }
.tab-btn{ font-family:var(--f-body); font-weight:600; font-size:13.5px; color: var(--ink-faint); background:none; border:none; padding: 10px 2px; margin-right: 24px; cursor:pointer; border-bottom: 2px solid transparent; margin-bottom:-1.5px; transition: color .15s ease; }
.tab-btn.active{ color: var(--heading); border-bottom-color: var(--accent); }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; animation: viewIn .28s ease; }

.meta-list{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); }
.meta-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.meta-row:last-child{ border-bottom:none; }
.meta-label{ font-family:var(--f-body); font-weight:500; font-size:13px; color: var(--ink-muted); }
.meta-value{ font-family:var(--f-body); font-weight:600; font-size:13px; color: var(--ink); text-align:right; }

.timeline{ position:relative; }
.timeline::before{ content:''; position:absolute; left:10px; top:10px; bottom:10px; width:2px; background: var(--border); }
.tl-item{ position:relative; padding: 0 0 14px 34px; }
.tl-item:last-child{ padding-bottom:0; }
.tl-node{ position:absolute; left:1px; top:3px; width:19px; height:19px; border-radius:50%; border:3px solid; display:flex; align-items:center; justify-content:center; background:var(--card-bg); z-index:1; }
.tl-node svg{ width:9px; height:9px; }
.tl-node.s-completed{ border-color: var(--green); color: var(--green); }
.tl-node.s-inprogress{ border-color: var(--accent); color: var(--accent); }
.tl-node.s-notstarted{ border-color: var(--amber); color: var(--amber); }
.tl-node.s-accepted{ border-color: var(--blue); color: var(--blue); }
.tl-card{ background:var(--card-bg); border:1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; box-shadow:var(--shadow-sm); }
.tl-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:11px; }
.tl-name{ /* uses t-card-title */ }
.tl-dates{ display:flex; gap:8px 14px; flex-wrap:wrap; margin: 10px 0 0; }
.tl-date{ font-family:var(--f-mono); font-size:11px; color:var(--ink-faint); }
.tl-date b{ color: var(--ink-muted); font-weight:400; }
.tl-notes-wrap{ margin-top:11px; padding-top:11px; border-top:1px dashed var(--border-strong); }
.tl-notes{ font-family:var(--f-body); font-size:12.5px; line-height:1.6; color: var(--ink-2); white-space:pre-line; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tl-notes.expanded{ display:block; -webkit-line-clamp:unset; overflow:visible; }
.tl-toggle{ font-family:var(--f-body); font-weight:600; font-size:12px; color: var(--heading); background:none; border:none; padding: 6px 0 0; cursor:pointer; }
.tl-owner{ font-family:var(--f-mono); font-size:10.5px; color: var(--ink-faint); margin-top:10px; }

/* ===================== PASSPORT ===================== */
.draft-note{ display:flex; align-items:flex-start; gap:9px; background: var(--amber-tint); border:1px solid var(--amber); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 18px; }
.draft-note svg{ flex-shrink:0; width:16px; height:16px; color: var(--amber); margin-top:1px; }
.draft-note p{ margin:0; font-family:var(--f-body); font-size:12px; line-height:1.55; color:var(--amber); }
.pp-block{ background:var(--card-bg); border:1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.pp-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.pp-head .risk-badge{ margin-left:auto; }
.pp-icon{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

.pp-label{ /* t-label */ }

.pp-effect .pp-icon{ background: var(--green-tint); color: var(--green); }

.pp-risks .pp-icon{ background: var(--amber-tint); color: var(--amber); }

/* ===== KPI metric tiles (База / Цель / Факт) ===== */
.kpi-metric{ margin-bottom:14px; }

.kpi-mini-row{ display:flex; gap:8px; }
.kpi-mini-tile{ flex:1; min-width:0; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-xs); padding:8px 6px; }
.kpi-mini-label{ font-size:9px; letter-spacing:0.08em; margin-bottom:4px; }
.kpi-mini-value{ font-family:var(--f-mono); font-size:12px; font-weight:700; color:var(--ink); word-break:break-word; }

/* ===== Effect cards (тип + статус + описание) ===== */

.effect-status-badge{ font-family:var(--f-body); font-weight:600; font-size:10.5px; padding:2px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0; }

.stage-ladder{ display:flex; align-items:flex-start; margin-top:4px; }
.stage-step{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
.stage-step:not(:last-child)::after{ content:''; position:absolute; top:7px; left:50%; width:100%; height:2px; background: var(--border); z-index:0; }
.stage-step.filled:not(:last-child)::after{ background: var(--accent); }
.stage-dot{ width:15px; height:15px; border-radius:50%; background:var(--card-bg); border:2.5px solid var(--border-strong); z-index:1; }
.stage-step.filled .stage-dot{ border-color: var(--accent); background: var(--accent); }
.stage-step.current .stage-dot{ border-color: var(--accent); background:var(--card-bg); box-shadow: 0 0 0 3px var(--accent-tint); }
.stage-name{ font-family:var(--f-body); font-weight:500; font-size:9.5px; color: var(--ink-faint); text-align:center; margin-top:8px; line-height:1.3; padding:0 2px; }
.stage-step.filled .stage-name, .stage-step.current .stage-name{ color: var(--ink); font-weight:600; }

/* ===================== ANALYTICS ===================== */

/* ===== Portfolio dynamics (started/completed by month, real dates) ===== */
.dyn-chart{ display:flex; align-items:flex-end; gap:8px; height:148px; padding: 0 2px 2px; }
.dyn-col{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; }
.dyn-bars{ flex:1; display:flex; align-items:flex-end; justify-content:center; gap:5px; width:100%; }
.dyn-bar-pair{ display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.dyn-bar-val{ font-family:var(--f-mono); font-size:9.5px; font-weight:600; color:var(--ink-faint); line-height:1; min-height:11px; }
.dyn-bar{ width:10px; height:0; border-radius:3px 3px 0 0; transition: height .9s cubic-bezier(.3,.8,.3,1); }
.dyn-bar.started{ background: var(--blue); }
.dyn-bar.completed{ background: var(--green); }
.dyn-month-label{ font-family:var(--f-mono); font-size:10px; color:var(--ink-faint); flex-shrink:0; }

.dyn-legend-dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
.dyn-legend-dot.started{ background:var(--blue); }
.dyn-legend-dot.completed{ background:var(--green); }

.workload-list{ display:flex; flex-direction:column; gap:10px; }

.swatch-row{ display:flex; gap:14px; }

.sync-example-tag{ font-family:var(--f-mono); font-size:9.5px; color:var(--ink-faint); text-align:center; margin-top:8px; letter-spacing:.04em; text-transform:uppercase; }
.info-row:first-child{ border-top:none; padding-top:2px; }
.info-row:last-child{ padding-bottom:2px; }
.info-label{ font-family:var(--f-body); font-weight:500; font-size:12.5px; color: var(--ink-muted); }

.footer-note{ text-align:center; font-family:var(--f-body); font-weight:500; font-size:11px; color: var(--ink-faint); padding: 22px 0 4px; }

/* ===================== BOTTOM NAV ===================== */
/* ===================== BOTTOM NAV — floating glass pill ===================== */
.bottom-nav{
  display:flex; position:absolute; left:16px; right:16px; bottom: calc(16px + var(--sab)); z-index: 20;
  border-radius: 26px; padding: 9px 4px calc(9px + var(--sab)*0.4);
  background: rgba(251,251,252,0.55);
  backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 12px 32px -8px rgba(16,40,62,0.30),
    inset 0 1px 1px rgba(255,255,255,0.85),
    inset 0 -1px 1px rgba(16,40,62,0.05);
}
.bottom-nav::before{
  content:''; position:absolute; top:1px; left:16px; right:16px; height:12px;
  border-radius:22px 22px 40px 40px; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
}
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; padding: 3px 2px; cursor:pointer; color: var(--ink-faint); transition: color .15s ease, transform .12s ease; position:relative; z-index:1; }
.nav-item:active{ transform: scale(.92); }
.nav-item svg{ width:22px; height:22px; transition: transform .18s cubic-bezier(.3,1.4,.5,1); }
.nav-item .nav-label{ font-family:var(--f-body); font-weight:600; font-size:10px; letter-spacing:0.01em; }
.nav-item.active{ color: var(--heading); }
.nav-item.active svg{ transform: translateY(-1px); filter: drop-shadow(0 1px 3px rgba(14,58,92,0.3)); }
.home-indicator{ display:none; width:132px; height:5px; background:#000; border-radius:3px; margin: 7px auto 5px; opacity:0.82; flex-shrink:0; }

@media (prefers-reduced-transparency: reduce){
  header.topbar{ background-image:none; background: var(--navy); backdrop-filter:none; -webkit-backdrop-filter:none; }
  .bottom-nav{ background: var(--card-bg); backdrop-filter:none; -webkit-backdrop-filter:none; border-color: var(--border); }
  .bottom-nav::before{ display:none; }
}

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* ===================== ENTRY GATE (soft barrier, not real security) ===================== */
.auth-gate{ position:absolute; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
  background: radial-gradient(1200px 700px at 50% -10%, #163f60 0%, #0E3A5C 45%, #0A2B44 100%);
  padding: calc(24px + var(--sat)) 24px calc(24px + var(--sab)); }
.auth-card{ width:100%; max-width:340px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
  border-radius:22px; padding:32px 26px 28px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  box-shadow: 0 24px 60px -16px rgba(0,0,0,0.4); text-align:center; }
.auth-card.shake{ animation: authShake .4s ease; }
@keyframes authShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
.auth-logo{ width:220px; height:auto; margin:0 auto 22px; border-radius:15px; background:rgba(255,255,255,0.1);
  display:flex; align-items:center; justify-content:center; padding:16px 18px; }
.auth-logo img{ width:100%; height:auto; object-fit:contain; display:block; }
.auth-title{ font-family:var(--f-display); font-weight:700; font-size:17px; color:#fff; margin-bottom:6px; }
.auth-sub{ font-family:var(--f-body); font-size:12.5px; color:rgba(255,255,255,0.55); margin-bottom:22px; }
.auth-input{ width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:12px;
  padding:13px 14px; font-family:var(--f-body); font-size:15px; color:#fff; text-align:center;
  letter-spacing:0.05em; margin-bottom:12px; outline:none; transition: border-color .15s ease, background .15s ease; }
.auth-input::placeholder{ color:rgba(255,255,255,0.35); letter-spacing:0.01em; }
.auth-input:focus{ border-color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.12); }
.auth-btn{ width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:13px;
  font-family:var(--f-body); font-weight:700; font-size:14px; cursor:pointer; transition: transform .12s ease, opacity .15s ease; }
.auth-btn:active{ transform:scale(.98); }
.auth-error{ min-height:18px; margin-top:12px; font-family:var(--f-body); font-weight:600; font-size:12px; color:#FF9B8A; }

/* ===================== ТЕЛЕФОН =====================
   Этот блок идёт последним намеренно: правила рамки и меню объявлены выше,
   и при равной силе побеждает тот, что записан позже. Раньше телефонные
   правила стояли в начале и молча перекрывались настольными. */
@media (max-width: 759px){
  html, body{ height:100%; overflow:hidden; }
  .stage{ min-height:0; height:100%; padding:0; }
  .iphone{ position:fixed; inset:0; width:auto; height:auto; max-width:none;
    border-radius:0; overflow:visible; box-shadow:none; }
  .iphone-screen{ -webkit-mask-image:none; mask-image:none;
    height:100%; border-radius:0; }
  /* Меню крепится к окну, а не к рамке: у рамки собственная высота, которая
     на устройстве не совпадает с видимой областью, и панель зависала над краем.
     Привязка к окну убирает эту зависимость целиком. */
  .bottom-nav{ position:fixed; bottom: calc(8px + var(--sab)); left:14px; right:14px; z-index:40; }
  .app-scroll{ padding-bottom: calc(96px + var(--sab)); }
}

/* ===================== ПРИЛОЖЕНИЕ С ГЛАВНОГО ЭКРАНА =====================
   Страница получает честную высоту экрана, рамка тянется за ней, а меню
   стоит внутри рамки у её нижнего края — то есть у нижнего края экрана.
   В Safari этот блок не действует: там меню должно быть над панелью браузера. */
@media (max-width: 759px){
  html.standalone{ height: 100lvh; }
  html.standalone body{ height: 100%; }
  html.standalone .stage{ height: 100%; }
  html.standalone .iphone{ position: relative; inset: auto; height: 100%; }
  html.standalone .iphone-screen{ height: 100%; }
  html.standalone .bottom-nav{ position: absolute; bottom: 6px; padding-bottom: 9px; }
  html.standalone .app-scroll{ padding-bottom: 96px; }
}

/* ===================== САЙТ НА КОМПЬЮТЕРЕ =====================
   От 1024 пикселей по ширине вместо макета телефона показывается обычный сайт:
   слева навигация, справа содержимое в несколько колонок. Разметка и скрипты те же,
   что у телефонного вида, меняется только раскладка. Узкие экраны сюда не попадают,
   поэтому телефонные правила выше остаются нетронутыми. */
.side-brand, .side-foot{ display:none; }

@media (min-width:1024px){
  :root{ --side-w:248px; }
  body{ background:var(--bg); }
  .stage{ display:block; height:100vh; min-height:0; padding:0; overflow:hidden; }
  .stage::before{ display:none; }
  .iphone{ width:100%; height:100%; transform:none; padding:0; border-radius:0; background:var(--bg); box-shadow:none; }
  .iphone::before, .iphone::after{ display:none; }
  .iphone-screen{ display:block; border-radius:0; -webkit-mask-image:none; padding-left:var(--side-w); }
  .dynamic-island, .status-bar, .home-indicator{ display:none; }
  .app-scroll{ height:100%; overflow-y:auto; scroll-behavior:auto; }
  .app-scroll::-webkit-scrollbar{ width:10px; }
  .app-scroll::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:10px; border:3px solid var(--bg); }

  /* --- боковая панель --- */
  .side-brand{ display:block; position:fixed; left:0; top:0; width:var(--side-w); padding:26px 22px 0; z-index:41; pointer-events:none; }
  .side-brand img{ display:block; height:34px; width:auto; }
  .side-title{ margin-top:14px; font-weight:700; font-size:15px; line-height:1.25; letter-spacing:-.01em; color:rgba(255,255,255,.92); }
  .bottom-nav{ position:fixed; left:0; top:0; bottom:0; right:auto; width:var(--side-w); flex-direction:column; justify-content:flex-start;
    gap:3px; padding:128px 12px 70px; border-radius:0; border:none; background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
    box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; z-index:40; }
  .bottom-nav::before{ display:none; }
  .nav-item{ flex:none; flex-direction:row; justify-content:flex-start; gap:12px; padding:11px 14px; border-radius:11px; color:rgba(255,255,255,.64); text-align:left; }
  .nav-item:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .nav-item:active{ transform:none; }
  .nav-item svg{ width:20px; height:20px; }
  .nav-item .nav-label{ font-size:14px; font-weight:600; letter-spacing:0; }
  .nav-item.active{ background:rgba(255,255,255,.13); color:#fff; }
  .nav-item.active svg{ transform:none; filter:none; }
  .side-foot{ display:block; position:fixed; left:0; bottom:0; width:var(--side-w); padding:14px 22px 18px; z-index:41;
    font-size:11.5px; line-height:1.55; color:rgba(255,255,255,.48); }

  /* --- шапка и содержимое --- */
  header.topbar .topbar-inner{ max-width:1240px; margin:0 auto; padding:22px 40px 18px; }
  .topbar-logo, .home-logo-row{ display:none !important; }
  .crumb-row{ margin-bottom:6px; }
  .back:hover{ background:rgba(255,255,255,.16); }
  .view{ max-width:1240px; margin:0 auto; padding:30px 40px 70px; }

  /* --- главная: итог слева, четыре показателя справа --- */
  #view-main:has(> .hero){ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); column-gap:24px; align-content:start; }
  #view-main:has(> .hero) > *{ grid-column:1 / -1; }
  #view-main:has(> .hero) > .hero{ grid-column:1; grid-row:1; margin-bottom:22px; }
  #view-main:has(> .hero) > .kpi-grid{ grid-column:2; grid-row:1; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
  .kpi-tile{ display:flex; flex-direction:column; justify-content:center; padding:14px 10px; }
  .attn-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:14px; align-items:start; }

  /* --- направления и списки задач --- */
  .cat-grid{ grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px; }
  .ledger{ display:grid; grid-template-columns:repeat(auto-fill,minmax(440px,1fr)); gap:16px; align-items:stretch; }
  .ledger .entry{ display:flex; flex-direction:column; }
  .ledger .entry .progress-row{ margin-top:auto; }
  .mode-toggle{ max-width:420px; }

  /* --- карточка проекта: обзор и паспорт слева, этапы справа, вкладки не нужны --- */
  #view-main:has(> .detail-card){ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto auto 1fr; column-gap:28px; align-items:start; align-content:start; }
  #view-main:has(> .detail-card) > .detail-card{ grid-column:1 / -1; }
  #view-main:has(> .detail-card) > .tabs{ display:none; }
  #view-main:has(> .detail-card) > .tab-panel{ display:block; animation:none; }
  #view-main:has(> .detail-card) > #tabOverview{ grid-column:1; grid-row:2; margin-bottom:26px; }
  #view-main:has(> .detail-card) > #tabPassport{ grid-column:1; grid-row:3; }
  #view-main:has(> .detail-card) > #tabSteps{ grid-column:2; grid-row:2 / span 2; }
  #view-main:has(> .detail-card) > .tab-panel::before{ display:block; margin:0 0 12px; font-weight:700; font-size:15px; letter-spacing:-.01em; color:var(--heading); }
  #tabOverview::before{ content:'Обзор'; }
  #tabSteps::before{ content:'Этапы'; }
  #tabPassport::before{ content:'Паспорт'; }

  /* --- «Ещё»: карточки ответственных в две колонки --- */
  .contact-card + .contact-card{ margin-top:0; }

  /* --- окна выбора: по центру, а не шторкой снизу --- */
  .ms{ left:50%; right:auto; top:50%; bottom:auto; width:480px; max-width:calc(100% - 40px); max-height:80vh; border-radius:20px;
    transform:translate(-50%,-46%) scale(.97); opacity:0; pointer-events:none;
    transition:transform .24s cubic-bezier(.22,.9,.3,1), opacity .2s ease; padding-bottom:14px; }
  .ms.on{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
  .ms-grip{ display:none; }
  .ms-head{ padding-top:20px; }
}

    <div class="auth-title">Портфель автоматизации</div>
    <div class="auth-sub">Введите ключ доступа</div>
    <form id="authForm" autocomplete="off">
      <input type="password" id="authInput" class="auth-input" placeholder="Ключ доступа" autocomplete="off" inputmode="text">
      <button type="submit" class="auth-btn">Войти</button>
    </form>
    <div class="auth-error" id="authError"></div>
  </div>
</div>
<script>
(function(){
  /* Пароль входа и ключ доступа к таблице — одно и то же. В файле его нет:
     он хранится только в браузере того, кто его ввёл. Поэтому человек,
     случайно нашедший адрес страницы, данных не увидит. */
  var API_URL = 'https://script.google.com/macros/s/AKfycbxUZCUrvCYB9p6NEtc6m3aujHP3t9al_r24OnFrmNCFnKzLnItWnZlZCfgukt3g9vkL/exec';
  var gate = document.getElementById('authGate');
  var form = document.getElementById('authForm');
  var input = document.getElementById('authInput');
  var errorEl = document.getElementById('authError');
  var card = document.getElementById('authCard');

  function openApp(){ gate.style.display = 'none'; }
  function refuse(msg){
    errorEl.textContent = msg;
    input.value = '';
    input.focus();
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }

  try{
    if(localStorage.getItem('kmm_api_key')){ openApp(); return; }
  }catch(e){}

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var key = input.value.trim();
    if(!key){ refuse('Введите ключ доступа'); return; }

    errorEl.textContent = 'Проверяем…';
    fetch(API_URL + '?key=' + encodeURIComponent(key) + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok){
          try{ localStorage.setItem('kmm_api_key', key); }catch(e){}
          openApp();
          if(typeof window.startSync === 'function') window.startSync();
        } else {
          refuse('Неверный ключ доступа');
        }
      })
      .catch(function(){
        refuse('Нет связи с таблицей, попробуйте позже');
      });
  });
  setTimeout(function(){ input.focus(); }, 300);
})();
</script>

/* ===================== СВЯЗЬ, ПИСЬМА И ОБСУЖДЕНИЕ =====================
   Адрес и ключ должны совпадать со скриптом, опубликованным из таблицы.
   Пока адрес пустой, портал работает на встроенных данных и ничего не пишет. */
const APP_VERSION = '2026.09.29-8';
const API_URL = 'https://script.google.com/macros/s/AKfycbxUZCUrvCYB9p6NEtc6m3aujHP3t9al_r24OnFrmNCFnKzLnItWnZlZCfgukt3g9vkL/exec';
/* Ключ вводится на экране входа и живёт только в этом браузере. */
let API_KEY = (function(){ try{ return localStorage.getItem('kmm_api_key') || ''; }catch(e){ return ''; } })();

/* Телефоны для WhatsApp берутся из листа «Телефоны» в таблице: так новый
   ответственный подключается добавлением строки, без правки этого файла.
   Список ниже — запасной, на случай если листа нет или связь недоступна. */
const PHONES_FALLBACK = {};
let PHONES_SHEET = {};

/* Почта ответственных. Главный источник — колонка «Почта» в листе «Телефоны».
   Если там пусто, берём адрес из колонки «Автор изменений» — но только если
   это действительно адрес: слова вроде «Портал» письмом не станут. */
let EMAILS_SHEET = {};
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim()); }
function emailKey(name){ return String(name || '').toLowerCase().replace(/\s+/g,' ').trim(); }
function emailFor(name){
  const key = emailKey(name);
  if (!key) return null;
  const listed = Object.keys(EMAILS_SHEET).find(function(k){ return emailKey(k) === key; });
  if (listed && validEmail(EMAILS_SHEET[listed])) return String(EMAILS_SHEET[listed]).trim();
  const votes = {};
  const vote = function(a){ if (validEmail(a)) votes[a] = (votes[a] || 0) + 1; };
  DATA.forEach(function(p){
    if (p.owner && emailKey(p.owner) === key) vote(p.mod_author);
    p.subtasks.forEach(function(s){ if (s.owner && emailKey(s.owner) === key) vote(s.mod_author); });
  });
  let best = null, n = 0;
  Object.keys(votes).forEach(function(e){ if (votes[e] > n){ n = votes[e]; best = e; } });
  return best;
}

function phoneKey(name){ return String(name || '').toLowerCase().replace(/\s+/g,' ').trim(); }

function buildPhoneIndex(){
  const idx = {};
  Object.keys(PHONES_FALLBACK).forEach(function(k){ idx[phoneKey(k)] = PHONES_FALLBACK[k]; });
  Object.keys(PHONES_SHEET).forEach(function(k){ idx[phoneKey(k)] = PHONES_SHEET[k]; });
  return idx;
}
let PHONES_INDEX = buildPhoneIndex();

function waNumber(name){
  const key = phoneKey(name);
  let raw = PHONES_INDEX[key] || '';
  /* Транковый префикс в скобках — британское «(0)» и похожее — внутри страны
     обязателен, в международном формате отбрасывается. */
  raw = String(raw).replace(/\(\s*0\s*\)/g, '');
  const digits = raw.replace(/\D/g, '');
  if (digits.length < 10) return '';
  if (digits.length === 11 && digits[0] === '8') return '7' + digits.slice(1);
  return digits;
}

let KPI_ROWS = [];               // строки листа «Показатели»
let LAST_PULL_CHANGED = false;   // изменили ли последние загруженные данные картину
let PULL_SEQ = 0, LAST_WRITE_AT = 0, WRITES_IN_FLIGHT = 0;
const CACHE_KEY = 'kmm_cache_v1';
const pause = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
function projNo(id){ return '№ ' + String(id).padStart(2,'0'); }
function norm2(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }

function stageLine(s){
  const parts = [];
  const st = statusMeta(s.status);
  if (st) parts.push(st.label);
  if (s.due_plan) parts.push('план ' + s.due_plan);
  if (s.due_actual) parts.push('факт ' + s.due_actual);
  return parts.join(' · ');
}

/* ------- тексты писем и сообщений ------- */
function buildMail(project, stage){
  const no = projNo(project.id);
  const subject = stage ? `${no} · ${project.title} — этап «${stage.name}»` : `${no} · ${project.title}`;
  const L = [];
  L.push(`Задача: ${no} — ${project.title}`);
  if (stage){
    L.push(`Этап: ${stage.name}`);
    const st = statusMeta(stage.status);
    if (st) L.push(`Статус этапа: ${st.label}`);
    if (stage.due_plan)   L.push(`Плановый срок: ${stage.due_plan}`);
    if (stage.due_actual) L.push(`Фактический срок: ${stage.due_actual}`);
    if (stage.owner)      L.push(`Ответственный за этап: ${stage.owner}`);
  } else {
    const st = statusMeta(project.status);
    if (st) L.push(`Статус задачи: ${st.label}`);
    L.push(`Этапов: ${project.subtasks.length}`);
  }
  L.push('', 'Вопрос:', '', '', '—', 'Отправлено из портфеля автоматизации КММ');
  return 'subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(L.join('\r\n'));
}

/* В чате текст короче: это переписка, а не документ. */
function buildWa(project, stage){
  const L = [];
  L.push(projNo(project.id) + ' · ' + project.title);
  if (stage){
    L.push('Этап: ' + stage.name);
    const line = stageLine(stage);
    if (line) L.push(line);
  } else {
    const st = statusMeta(project.status);
    if (st) L.push('Статус: ' + st.label);
  }
  L.push('', 'Вопрос: ');
  return encodeURIComponent(L.join('\n'));
}

/* ---------- сохранённая копия ----------
   Последние полученные данные лежат в браузере. При запуске портал сразу
   рисует их, а свежие подгружает фоном: пустого ожидания и красной плашки
   при слабой связи больше нет. Копия хранится только на этом устройстве
   и стирается вместе с ключом доступа. */
function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      t: LAST_SYNC ? LAST_SYNC.getTime() : Date.now(),
      projects: DATA, comments: COMMENTS, phones: PHONES_SHEET, emails: EMAILS_SHEET, passports: PASSPORT_ROWS, kpis: KPI_ROWS }));
  }catch(e){}
}
function hydrateFromCache(){
  if (!API_KEY) return false;
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const c = JSON.parse(raw);
    if (!c || !Array.isArray(c.projects) || !c.projects.length) return false;
    DATA = c.projects;
    COMMENTS = c.comments || [];
    PHONES_SHEET = c.phones || {};
    PHONES_INDEX = buildPhoneIndex();
    EMAILS_SHEET = c.emails || {};
    PASSPORT_ROWS = c.passports || [];
    KPI_ROWS = c.kpis || [];
    LAST_SYNC = new Date(c.t || Date.now());
    FROM_CACHE = true;
    return true;
  }catch(e){ return false; }
}
function dropKey(){
  try{ localStorage.removeItem('kmm_api_key'); localStorage.removeItem(CACHE_KEY); }catch(e){}
  API_KEY = '';
  const g = document.getElementById('authGate');
  if (g) g.style.display = '';
  return false;
}

/* Запрос с ограничением по времени. Скрипт таблицы после простоя просыпается
   несколько секунд, поэтому ждём подольше, но не бесконечно. */
async function fetchJson(url, init, timeoutMs){
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = ctl ? setTimeout(function(){ ctl.abort(); }, timeoutMs) : null;
  try{
    const res = await fetch(url, Object.assign({}, init, ctl ? { signal: ctl.signal } : {}));
    const text = await res.text();
    try{ return JSON.parse(text); }
    catch(e){ throw new Error('Таблица вернула не данные'); }
  } finally { if (timer) clearTimeout(timer); }
}

function dataSignature(){
  return JSON.stringify([DATA, COMMENTS, PHONES_SHEET, EMAILS_SHEET, PASSPORT_ROWS, KPI_ROWS]);
}
function applyPulled(data){
  const before = dataSignature();
  DATA = data.projects;
  COMMENTS = data.comments || [];
  PHONES_SHEET = data.phones || {};
  PHONES_INDEX = buildPhoneIndex();
  EMAILS_SHEET = data.emails || {};
  PASSPORT_ROWS = data.passports || [];
  KPI_ROWS = data.kpis || [];
  LAST_SYNC = new Date();
  SHEETS_OK = true;
  updateSideFoot();
  LAST_PULL_CHANGED = FROM_CACHE || before !== dataSignature();
  FROM_CACHE = false;
  saveCache();
}

/* Загрузка данных. При обрыве повторяем: сразу после запуска с главного
   экрана сеть телефона ещё просыпается, и первая попытка нередко проваливается,
   хотя через секунду всё работает. Ответ, запрошенный до последней записи или
   обогнанный более новым запросом, отбрасывается — иначе старая картинка
   могла затирать только что сделанное изменение. */
async function pullData(silent){
  if (!API_URL || !API_KEY) return false;
  const startedAt = Date.now();
  const mySeq = ++PULL_SEQ;
  LAST_PULL_CHANGED = false;
  if (!silent) syncBadge('Обновление');
  const waits = [0, 1200, 3500];
  for (let i = 0; i < waits.length; i++){
    if (waits[i]) await pause(waits[i]);
    try{
      const data = await fetchJson(API_URL + '?key=' + encodeURIComponent(API_KEY) + '&t=' + Date.now(),
        { cache: 'no-store' }, 20000);
      if (!data.ok){
        if (/ключ/i.test(String(data.error || ''))) return dropKey();
        throw new Error(data.error || 'Таблица вернула ошибку');
      }
      if (startedAt < LAST_WRITE_AT || WRITES_IN_FLIGHT > 0 || mySeq !== PULL_SEQ){
        return true;           // устарел: показываем то, что уже на экране
      }
      applyPulled(data);
      if (!silent){ syncBadge('Данные обновлены'); syncHide(); }
      return true;
    }catch(err){ /* пробуем ещё раз */ }
  }
  if (!silent){
    /* Данные есть на экране — это не авария, плашка без красного. */
    const haveShown = FROM_CACHE || !!LAST_SYNC;
    syncBadge(haveShown ? 'Нет связи, показаны сохранённые данные' : 'Нет связи с таблицей', !haveShown);
    syncHide(2800);
  }
  return false;
}

/* Запись. Повторно не отправляем: комментарий не должен задвоиться. */
async function pushAction(payload){
  if (!API_URL || !API_KEY){ syncBadge('Таблица не подключена', true); syncHide(2200); return null; }
  syncBadge('Сохранение');
  WRITES_IN_FLIGHT++;
  try{
    /* Простой тип содержимого выбран намеренно: он не вызывает
       предварительный запрос, который Apps Script не обрабатывает. */
    const out = await fetchJson(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ key: API_KEY }, payload))
    }, 25000);
    if (!out.ok) throw new Error(out.error || 'Не сохранено');
    syncBadge('Сохранено'); syncHide();
    return out;
  }catch(err){
    syncBadge(err && err.name === 'AbortError' ? 'Таблица не ответила, попробуйте ещё раз'
                                                : String(err.message || err), true);
    syncHide(3200);
    return null;
  }finally{
    WRITES_IN_FLIGHT--;
    LAST_WRITE_AT = Date.now();
  }
}

/* Сверка с таблицей через короткую паузу после записи. */
function schedulePull(ms){
  setTimeout(function(){
    pullData(true).then(function(ok){ if (ok && LAST_PULL_CHANGED) rerenderCurrent(); });
  }, ms);
}

/* Перерисовка на месте: остаёмся на том же экране, с той же прокруткой,
   и не теряем набранный, но не отправленный комментарий. Если открытая
   карточка пропала из свежих данных (строку в таблице сдвинули или удалили),
   не трогаем экран — иначе роутер молча уведёт на главную. */
function rerenderCurrent(){
  const sc = document.getElementById('appScroll');
  const y = sc ? sc.scrollTop : 0;
  const m = location.hash.match(/^#\/project\/(\d+)$/);
  if (m && !DATA.some(function(p){ return p.id === parseInt(m[1], 10); })) return;

  const typed = {};
  let focusId = null;
  document.querySelectorAll('.cm-add input').forEach(function(i){
    if (i.value) typed[i.id] = i.value;
    if (document.activeElement === i) focusId = i.id;
  });
  /* Карточка проекта рисуется заново с вкладкой «Обзор» по умолчанию. Запоминаем,
     на какой вкладке были, и возвращаемся на неё — иначе после смены статуса
     на «Этапах» выбрасывало на «Обзор». */
  let tab = null;
  if (m){
    const act = document.querySelector('.tabs .tab-btn.active');
    if (act && act.id.indexOf('tabBtn') === 0) tab = act.id.slice(6).toLowerCase();
  }
  route();
  if (tab && document.getElementById('tabBtn' + cap(tab))) switchDetailTab(tab);
  Object.keys(typed).forEach(function(id){
    const el = document.getElementById(id);
    if (el) el.value = typed[id];
  });
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus(); }
  if (sc) sc.scrollTo(0, y);
}

/* Меняет статус в данных, которые уже на экране, и возвращает функцию отмены. */
function localStatus(row, code){
  for (let i = 0; i < DATA.length; i++){
    const p = DATA[i];
    if (p.row === row){ const prev = p.status; p.status = code; return function(){ p.status = prev; }; }
    for (let j = 0; j < p.subtasks.length; j++){
      const s = p.subtasks[j];
      if (s.row === row){ const prev = s.status; s.status = code; return function(){ s.status = prev; }; }
    }
  }
  return null;
}

/* Статус меняется на экране сразу, а таблица подтверждает следом. Если запись
   не прошла, возвращаем прежний статус. Через секунду сверяемся с таблицей. */
async function applyStatus(code){
  const st = MS_STATE;
  closeMailSheet();
  if (!st || st.mode !== 'status') return;
  const undo = localStatus(st.row, code);
  if (undo){ saveCache(); rerenderCurrent(); }
  const out = await pushAction({ action:'status', row: st.row, name: st.name, value: code });
  if (!out && undo){ undo(); saveCache(); rerenderCurrent(); }
  schedulePull(out ? 1200 : 500);
}

/* ------- обсуждение этапа ------- */
function commentsFor(row){
  return COMMENTS.filter(function(c){ return String(c.target) === String(row); })
                 .sort(function(a,b){ return new Date(a.at) - new Date(b.at); });
}
function shortAuthor(email){
  const s = String(email || '').split('@')[0].replace(/[._-]+/g, ' ').trim();
  return s ? s.replace(/\b\w/g, function(m){ return m.toUpperCase(); }) : 'Аноним';
}
function fmtWhen(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.getDate() + ' ' + RU_MONTHS[d.getMonth()] + ', ' +
    (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
}
/* Список комментариев отрисовывается отдельно от формы: так после отправки
   обновляется только он, а страница не перерисовывается и не уезжает вверх. */
function commentsList(row){
  return commentsFor(row).map(function(c){
    const who = shortAuthor(c.author);
    const pending = c.pending ? ' cm-pending' : '';
    return `<div class="cm-item${pending}">
      <div class="cm-av">${escapeHtml(initials(who))}</div>
      <div class="cm-body">
        <div class="cm-head"><b>${escapeHtml(who)}</b><span>${c.pending ? 'отправляется…' : fmtWhen(c.at)}</span></div>
        <div class="cm-text">${escapeHtml(c.text)}</div>
      </div>
      ${(c.row && !c.pending) ? `<button class="cm-del" title="Удалить" onclick="removeComment(${c.row}, this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>` : ''}
    </div>`;
  }).join('');
}

function commentsBlock(row){
  if (!API_URL || !row) return '';
  const n = commentsFor(row).length;
  return `<div class="cm-wrap">
    <div class="cm-list" id="cml-${row}">${commentsList(row)}</div>
    <div class="cm-add">
      <input type="text" id="cmi-${row}" placeholder="${n ? 'Ответить' : 'Комментарий к этапу'}"
             onkeydown="if(event.key==='Enter'){sendComment(${row});}">
      <button class="cm-send" onclick="sendComment(${row})" title="Отправить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div></div>`;
}

/* Обновляем только список нужного этапа, не трогая остальную страницу. */
function refreshComments(row){
  const el = document.getElementById('cml-' + row);
  if (el) el.innerHTML = commentsList(row);
}

async function sendComment(row){
  const input = document.getElementById('cmi-' + row);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  /* Показываем сообщение сразу, не дожидаясь ответа таблицы: так видно,
     что нажатие сработало, а курсор остаётся в поле для следующей мысли. */
  const temp = { row: null, pending: true, at: new Date().toISOString(),
                 author: 'вы', target: String(row), text: text };
  COMMENTS.push(temp);
  input.value = '';
  refreshComments(row);
  input.focus();

  const out = await pushAction({ action:'comment', target: row, text: text });
  const i = COMMENTS.indexOf(temp);
  if (out){
    if (i >= 0) COMMENTS[i] = { row: out.row, at: out.at, author: out.author,
                                target: String(out.target), text: out.text };
  } else {
    if (i >= 0) COMMENTS.splice(i, 1);
    input.value = text;
  }
  refreshComments(row);
}

async function removeComment(row, btn){
  const idx = COMMENTS.findIndex(function(x){ return String(x.row) === String(row); });
  if (idx < 0) return;
  const c = COMMENTS[idx];
  const target = c.target;
  if (btn){ btn.disabled = true; btn.style.opacity = '.25'; }

  const out = await pushAction({ action:'delComment', row: row, text: c.text });
  if (out){
    COMMENTS.splice(idx, 1);
    /* Строки листа после удаления сдвигаются, поэтому перечитываем
       комментарии целиком — иначе следующее удаление промахнётся. */
    await pullData(true);
    refreshComments(target);
  } else if (btn){ btn.disabled = false; btn.style.opacity = ''; }
}

/* ===================== EXCEL IMPORT (client-side, no server) =====================
   Повторяет логику исходного python-парсера: колонки листа —
   №, Задача, Описание, Начало, Срок(факт/прогноз), Срок(план), Delay,
   Заметки, Статус, Ответственный, Длительность, Изменено, Автор изменений. */
function excelSerialToDate(v){
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    // Excel serial date -> JS Date (SheetJS usually returns Date objects with cellDates:true, this is a fallback)
    return new Date(Math.round((v - 25569) * 86400 * 1000));
  }
  return null;
}
function xFmtDate(v){
  const d = excelSerialToDate(v);
  if(!d || isNaN(d)) return null;
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
function xFmtDateTime(v){
  const d = excelSerialToDate(v);
  if(!d || isNaN(d)) return null;
  return xFmtDate(v) + ', ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function xToIso(v){
  const d = excelSerialToDate(v);
  return (d && !isNaN(d)) ? d.toISOString() : null;
}
function parseExcelWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, { type:'array', cellDates:true });
  let sheetName = wb.SheetNames.find(n => /задач/i.test(n)) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, range:1, defval:null });

  function cleanStatus(raw){
    if(!raw) return null;
    const norm = normalizeStatus(raw);
    return norm || String(raw).trim();
  }

  const projects = [];
  let cur = null;
  rows.forEach(row=>{
    const [n, title, desc, start, due_act, due_plan, delay, notes, status, owner, duration, modified, mod_author] = row;
    if(n !== null && n !== undefined && n !== ''){
      cur = {
        id: parseInt(n, 10),
        title: (title||'').toString().trim(),
        subtitle: (desc||'').toString().trim(),
        status: cleanStatus(status),
        owner: owner || null,
        modified: xFmtDate(modified),
        modified_iso: xToIso(modified),
        mod_author: mod_author || null,
        subtasks: []
      };
      if(!isNaN(cur.id)) projects.push(cur);
    } else {
      if(!cur) return;
      if(desc==null && status==null && start==null) return;
      cur.subtasks.push({
        name: (desc||'').toString().trim(),
        start: xFmtDate(start),
        due_actual: xFmtDate(due_act),
        due_plan: xFmtDate(due_plan),
        delay: delay || null,
        notes: notes ? String(notes).trim() : null,
        status: cleanStatus(status),
        owner: owner || null,
        duration: duration || null,
        modified: xFmtDateTime(modified),
        modified_iso: xToIso(modified),
        mod_author: mod_author || null
      });
    }
  });
  return projects;
}

let lastImportMsg = null; // {text, ok} — survives the renderMore() re-render right after import

function handleExcelImport(file){
  const statusEl = document.getElementById('importStatus');
  if(typeof XLSX === 'undefined'){
    if(statusEl){ statusEl.textContent = 'Не удалось загрузить модуль чтения Excel — нужен интернет при открытии приложения. Проверьте соединение и попробуйте снова.'; statusEl.className = 'import-status err'; }
    return;
  }
  if(statusEl){ statusEl.textContent = 'Читаю файл…'; statusEl.className = 'import-status'; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const projects = parseExcelWorkbook(e.target.result);
      if(!projects.length) throw new Error('empty');
      let stepCount = 0; projects.forEach(p=>stepCount+=p.subtasks.length);
      DATA = projects;
      dataSource = 'imported';
      dataImportedAt = new Date().toISOString();
      try{
        localStorage.setItem('kmm_data', JSON.stringify(DATA));
        localStorage.setItem('kmm_data_imported_at', dataImportedAt);
        localStorage.setItem('kmm_data_filename', file.name);
      }catch(err){}
      lastImportMsg = { text: `Готово — загружено ${projects.length} проектов, ${stepCount} этапов из «${file.name}»`, ok: true };
      renderMore();
    }catch(err){
      lastImportMsg = { text: 'Не получилось прочитать файл. Проверьте, что структура листа совпадает с исходной.', ok: false };
      renderMore();
    }
  };
  reader.onerror = function(){
    lastImportMsg = { text: 'Не удалось прочитать файл.', ok: false };
    renderMore();
  };
  reader.readAsArrayBuffer(file);
}
function resetToEmbeddedData(){
  DATA = EMBEDDED_DATA;
  dataSource = 'embedded';
  dataImportedAt = null;
  lastImportMsg = { text: 'Данные возвращены к исходным.', ok: true };
  try{
    localStorage.removeItem('kmm_data');
    localStorage.removeItem('kmm_data_imported_at');
    localStorage.removeItem('kmm_data_filename');
  }catch(e){}
  renderMore();
}

/* Ключевые слова, по которым новая задача сама попадает в направление.
   Нужны потому, что список номеров выше не знает о задачах, добавленных
   в таблицу после сборки портала. */
/* Порядок важен: сначала узкие направления, потом широкое «СЭД и AI»,
   иначе почти любая задача попадёт в него по слову «документ». */
const CATEGORY_KEYWORDS = [
  ['telephony',     /телефон|\bivr\b|колл-?центр|call-?центр|\bатс\b/i],
  ['presentations', /презентац|слайд|power\s*point|питч|доклад/i],
  ['dashboards',    /дашборд|dashboard|отчётност|отчетност|аналитик|\bbi\b|power\s*bi|метрик|мониторинг/i],
  ['sed_ai',        /\bai\b|\bии\b|искусственн|сэд|документооборот|агент|нейросет|распознав|шаблон|\bвнд\b|\bорд\b|письм|договор|архив|канцеляр/i]
];

/* Направление задачи: сначала явный список номеров, затем ключевые слова
   в названии, и только потом — «Прочие задачи», чтобы ничего не терялось. */
function categoryKeyFor(project){
  const explicit = CATEGORIES.find(function(c){ return c.ids.indexOf(project.id) >= 0; });
  if (explicit) return explicit.key;
  const text = String(project.title || '') + ' ' + String(project.subtitle || '');
  const hit = CATEGORY_KEYWORDS.find(function(pair){ return pair[1].test(text); });
  return hit ? hit[0] : 'other';
}

function projectsOfCategory(key){
  return DATA.filter(function(p){ return categoryKeyFor(p) === key; });
}

function hexToRgb(hex){
  const h = hex.replace('#','');
  return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) };
}
function hexToRgba(hex, alpha){
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}
function catColor(cat){ return (currentMode==='dark' && cat.colorDark) ? cat.colorDark : cat.color; }
function catTint(cat){ return currentMode==='dark' ? hexToRgba(catColor(cat), 0.16) : cat.tint; }

const STATUS_MAP = {
  'Completed':   { cls:'s-completed',  label:'Завершено' },
  'In progress': { cls:'s-inprogress', label:'В работе' },
  'Not started': { cls:'s-notstarted', label:'Не начато' },

};
/* Устойчивое сопоставление: разный регистр, пробелы, написание по-русски —
   всё сводится к одному из 4 канонических статусов. */
const STATUS_ALIASES = {
  'completed':'Completed', 'complete':'Completed', 'done':'Completed', 'finished':'Completed',
  'завершено':'Completed', 'завершен':'Completed', 'завершена':'Completed', 'завершён':'Completed',
  'готово':'Completed', 'выполнено':'Completed', 'выполнен':'Completed', 'выполнена':'Completed',
  'in progress':'In progress', 'inprogress':'In progress', 'in-progress':'In progress', 'ongoing':'In progress',
  'в работе':'In progress', 'выполняется':'In progress', 'в процессе':'In progress',
  'not started':'Not started', 'notstarted':'Not started', 'not-started':'Not started', 'pending':'Not started', 'todo':'Not started', 'to do':'Not started',
  'не начато':'Not started', 'не начат':'Not started', 'не начата':'Not started', 'ожидает':'Not started',
  'accepted':'Accepted', 'accept':'Accepted', 'approved':'Accepted',
  'принято':'Accepted', 'принят':'Accepted', 'принята':'Accepted', 'утверждено':'Accepted'
};
function normalizeStatus(raw){
  if(!raw) return null;
  const key = String(raw).trim().toLowerCase().replace(/\s+/g,' ');
  return STATUS_ALIASES[key] || null;
}
const STATUS_ORDER = ['s-completed','s-inprogress','s-accepted','s-notstarted'];
const STATUS_LABELS = { 's-completed':'Завершено', 's-inprogress':'В работе', 's-accepted':'Принято', 's-notstarted':'Не начато' };
function statusMeta(s){
  const canonical = STATUS_MAP[s] ? s : normalizeStatus(s);
  return (canonical && STATUS_MAP[canonical]) ? STATUS_MAP[canonical] : { cls:'s-notstarted', label: s || '—' };
}

const RU_MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtRu(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.getDate() + ' ' + RU_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
