  if(cls==='s-inprogress') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
  if(cls==='s-accepted') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="7"/></svg>';
}
function progressPct(project){
  if(isProjectDone(project)) return 100;
  const subs = project.subtasks;
  if(!subs.length) return statusMeta(project.status).cls === 's-completed' ? 100 : 0;
  let sum = 0;
  subs.forEach(s=>{
    const cls = statusMeta(s.status).cls;
    if(cls==='s-completed' || cls==='s-accepted') sum += 1;
  });
  return Math.round((sum/subs.length)*100);
}
function overallPct(){
  let total=0, sum=0;
  DATA.forEach(p=>p.subtasks.forEach(s=>{
    total++;
    const cls = statusMeta(s.status).cls;
    if(cls==='s-completed' || cls==='s-accepted') sum += 1;
  }));
  return total ? Math.round((sum/total)*100) : 0;
}
function statusCounts(){
  const c = { 's-completed':0, 's-inprogress':0, 's-accepted':0, 's-notstarted':0 };
  let total=0;
  DATA.forEach(p=>p.subtasks.forEach(s=>{ c[statusMeta(s.status).cls]++; total++; }));
  return { counts:c, total };
}

/* ===================== RISK / DEVIATION ENGINE =====================
   Считается прямо в браузере по датам план/факт из тех же данных —
   без придуманных цифр. "Сегодня" — реальная текущая дата устройства,
   так что расчёты остаются верными и после импорта новых данных. */
const _now = new Date();
const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());
const STATUS_DONE = ['Completed','Accepted'];

/* Проект считается завершённым, если:
   а) верхняя строка сама помечена Completed/Accepted, ИЛИ
   б) все этапы внутри неё помечены Completed/Accepted — даже если верхнюю
      строку никто отдельно не обновил. Второе выводится автоматически. */
function isProjectDone(project){
  if(STATUS_DONE.includes(project.status)) return true;
  if(project.subtasks.length > 0 && project.subtasks.every(s => STATUS_DONE.includes(s.status))) return true;
  return false;
}
function effectiveProjectStatus(project){
  return isProjectDone(project) ? 'Completed' : project.status;
}
/* Вручную отмечено по смыслу заметок к этапам: есть ли внешняя зависимость
   (другое подразделение, поставщик, другой проект, данные извне) */
const EXTERNAL_DEP = {1:true, 2:true, 3:false, 4:true, 5:true, 6:false, 7:true, 8:true, 9:true, 10:false, 11:true};

function parseRuDate(d){
  if(!d) return null;
  const parts = d.split('.');
  if(parts.length!==3) return null;
  const [dd,mm,yyyy] = parts;
  const dt = new Date(`${yyyy}-${mm}-${dd}`);
  return isNaN(dt) ? null : dt;
}
function daysBetween(a,b){ return Math.round((a-b)/(1000*60*60*24)); }

function computeRisk(project){
  if(isProjectDone(project)){
    return { score:0, level:'s-low', maxDelay:null, maxDelayIsForecast:false, overdueOpen:0, noDateShare:0, extDep:false, reasons:[] };
  }
  let maxDelay = null;
  let maxDelayIsForecast = false;
  let overdueOpen = 0;
  let noDateCount = 0;
  const total = project.subtasks.length;

  project.subtasks.forEach(s=>{
    const plan = parseRuDate(s.due_plan);
    const actual = parseRuDate(s.due_actual);
    const done = STATUS_DONE.includes(s.status);
    if(!plan) noDateCount++;
    if(plan && actual){
      const delta = daysBetween(actual, plan);
      if(maxDelay===null || delta > maxDelay){ maxDelay = delta; maxDelayIsForecast = !done; }
    }
    if(plan && !done && plan < TODAY) overdueOpen++;
  });

  const noDateShare = total ? noDateCount/total : 0;
  const extDep = !!EXTERNAL_DEP[project.id];

  let score = 0;
  if(maxDelay !== null){
    if(maxDelay > 30) score += 2;
    else if(maxDelay > 0) score += 1;
  }
  if(overdueOpen > 0) score += 1;
  if(extDep) score += 1;
  if(noDateShare > 0.5) score += 1;

  const level = score >= 4 ? 's-high' : (score >= 2 ? 's-medium' : 's-low');
  const reasons = [];
  if(maxDelay !== null && maxDelay > 0) reasons.push(`${maxDelayIsForecast ? 'Прогнозное отставание' : 'Отставание по срокам'}: +${maxDelay} дн. на одном из этапов`);
  if(overdueOpen > 0) reasons.push(`${overdueOpen} ${overdueOpen===1?'этап прошёл':'этапа/этапов прошли'} плановый срок без завершения`);
  if(extDep) reasons.push('Есть внешняя зависимость — другое подразделение, поставщик или проект');
  if(noDateShare > 0.5) reasons.push('Плановые сроки не указаны для большинства этапов');

  return { score, level, maxDelay, maxDelayIsForecast, overdueOpen, noDateShare, extDep, reasons };
}
const RISK_LABEL = { 's-low':'Низкий', 's-medium':'Средний', 's-high':'Высокий' };
function riskBadge(level, size){
  const cls = level==='s-high' ? 'risk-high' : (level==='s-medium' ? 'risk-medium' : 'risk-low');
  if(size==='sm'){
    if(level==='s-low') return '';
    return `<div class="risk-chip-sm ${cls}"><span class="dot" style="width:5px;height:5px;border-radius:50%;background:currentColor;"></span>Риск: ${RISK_LABEL[level]}</div>`;
  }
  return `<div class="risk-badge ${cls}"><span class="dot"></span>Риск: ${RISK_LABEL[level]}</div>`;
}

function portfolioOnTime(){
  let withBoth=0, onTime=0, deltas=[];
  DATA.forEach(p=>p.subtasks.forEach(s=>{
    const plan = parseRuDate(s.due_plan), actual = parseRuDate(s.due_actual);
    if(plan && actual){
      withBoth++;
      const delta = daysBetween(actual, plan);
      deltas.push(delta);
      if(delta<=0) onTime++;
    }
  }));
  const pct = withBoth ? Math.round(onTime/withBoth*100) : null;
  const avgDelay = deltas.length ? Math.round(deltas.reduce((a,b)=>a+b,0)/deltas.length) : null;
  return { pct, withBoth, onTime, avgDelay };
}

function attentionProjects(){
  return DATA.map(p=>({ project:p, risk:computeRisk(p) }))
    .filter(x=>x.risk.level==='s-high')
    .sort((a,b)=>b.risk.score - a.risk.score);
}
function portfolioOverdueCount(){
  let n = 0;
  DATA.forEach(p=>{
    if(isProjectDone(p)) return;
    p.subtasks.forEach(s=>{
      const plan = parseRuDate(s.due_plan);
      const done = STATUS_DONE.includes(s.status);
      if(plan && !done && plan < TODAY) n++;
    });
  });
  return n;
}
function upcomingMilestones(limit){
  const items = [];
  DATA.forEach(p=>{
    if(isProjectDone(p)) return;
    p.subtasks.forEach(s=>{
      const plan = parseRuDate(s.due_plan);
      const done = STATUS_DONE.includes(s.status);
      if(plan && !done && plan >= TODAY) items.push({ p, s, plan });
    });
  });
  items.sort((a,b)=>a.plan-b.plan);
  return items.slice(0, limit || 5);
}
function colorForCls(cls){
  if(cls==='s-completed') return 'var(--green)';
  if(cls==='s-inprogress') return 'var(--accent)';
  if(cls==='s-accepted') return 'var(--blue)';
  return 'var(--amber)';
}
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

/* ===== animation helpers ===== */
function animateCount(el, target, dur){
  if(!el) return;
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/dur);
    const e = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(target*e) + '%';
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function raf2(fn){ requestAnimationFrame(()=>requestAnimationFrame(fn)); }

function entryCard(p){
  const meta = statusMeta(effectiveProjectStatus(p));
  const pct = progressPct(p);
  const risk = computeRisk(p);

      <div class="entry-top">
        <div>
          <div class="entry-id t-code">№ ${String(p.id).padStart(2,'0')}</div>
          <div class="t-card-title">${escapeHtml(p.title)}</div>
          ${riskBadge(risk.level, 'sm')}
        </div>

      </div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" data-w="${pct}" style="background:${colorForCls(meta.cls)}"></div></div>
        <div class="progress-pct">${pct}%</div>
      </div>
    </div>`;
}

/* ===== ANALYTICS ===== */
function ownerWorkload(){
  const map = {};
  DATA.forEach(p=>{
    const contact = getProjectContact(p);
    if(!contact) return;
    if(!map[contact.name]) map[contact.name] = { name:contact.name, count:0, high:0, medium:0, low:0, projects:[] };
    map[contact.name].count++;
    map[contact.name].projects.push(p);
    const risk = computeRisk(p);
    if(risk.level==='s-high') map[contact.name].high++;
    else if(risk.level==='s-medium') map[contact.name].medium++;
    else map[contact.name].low++;
  });
  const list = Object.values(map);
  list.forEach(w=>{ w.avgPct = Math.round(w.projects.reduce((s,p)=>s+progressPct(p),0)/w.projects.length); });
  return list.sort((a,b)=>b.count-a.count);
}

/* Оценка эффекта: доля проектов с эффектом (noEffect !== true), у которых
   хотя бы один effects[].status отличается от 'нет оценки'. statusBreakdown —
   задел на будущее: как только появится 'черновая оценка' / 'подтверждено',
   они начнут считаться и показываться отдельно, без изменений в этой функции. */
function effectReadiness(){
  const withEffect = DATA.filter(p => !getPassport(p).noEffect);
  let scored = 0;
  const statusBreakdown = {};
  withEffect.forEach(p=>{
    const pp = getPassport(p);
    if(!pp || !pp.effects) return;
    if(pp.effects.some(e => e.status !== 'нет оценки')) scored++;
    pp.effects.forEach(e=>{
      if(e.status !== 'нет оценки') statusBreakdown[e.status] = (statusBreakdown[e.status]||0) + 1;
    });
  });
  return { total: withEffect.length, scored, statusBreakdown };
}

/* Динамика портфеля: группировка реальных дат из subtasks по месяцам —
   start → "начато", due_actual (только для STATUS_DONE) → "завершено".
   Диапазон месяцев считается от самого раннего start в данных до текущего
   месяца, так что пересчитывается заново на любых будущих данных. */
const MONTH_SHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
function portfolioDynamics(){
  let minDate = null;
  DATA.forEach(p=>p.subtasks.forEach(s=>{
    const d = parseRuDate(s.start);
    if(d && (!minDate || d < minDate)) minDate = d;
  }));
  if(!minDate) return [];
  const months = [];
  let cursor = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  const end = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  while(cursor <= end){
    months.push({ year: cursor.getFullYear(), month: cursor.getMonth(), started:0, completed:0 });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  // totalSteps используется в прогнозе завершения (burnupForecast).
  const bucketFor = (d) => months.find(m => m.year===d.getFullYear() && m.month===d.getMonth());
  let totalSteps = 0;
  DATA.forEach(p=>p.subtasks.forEach(s=>{
    totalSteps++;
    const startD = parseRuDate(s.start);
    if(startD){ const b = bucketFor(startD); if(b) b.started++; }
    if(STATUS_DONE.includes(s.status)){
      const doneD = parseRuDate(s.due_actual);
      if(doneD){ const b = bucketFor(doneD); if(b) b.completed++; }
    }
  }));
  months.totalSteps = totalSteps;
  return months;
}

/* Прогноз завершения (burn-up): темп берём как средние "завершено" за
   последние до 3 месяцев с ненулевой активностью — если темпа нет,
   честно говорим, что прогноз посчитать не на чем, а не рисуем дату наугад. */
function burnupForecast(){
  const months = portfolioDynamics();
  const totalSteps = months.totalSteps || 0;
  let completedSteps = 0;
  DATA.forEach(p=>p.subtasks.forEach(s=>{ if(STATUS_DONE.includes(s.status)) completedSteps++; }));
  const remaining = totalSteps - completedSteps;
  const activeMonths = months.filter(m=>m.completed>0).slice(-3);
  const pace = activeMonths.length ? activeMonths.reduce((s,m)=>s+m.completed,0)/activeMonths.length : 0;

  let projectedDate = null, monthsNeeded = null;
  if(remaining>0 && pace>0){
    monthsNeeded = remaining/pace;
    const d = new Date(TODAY);
    d.setDate(d.getDate() + Math.round(monthsNeeded*30.4));
    projectedDate = d;
  }
  return { totalSteps, completedSteps, remaining, pace, monthsNeeded, projectedDate };
}

/* Просрочка этапов — распределение по тем же порогам, что и риск-движок
   (0 / 1–30 / 30+ дней), чтобы не вводить новую отдельную шкалу.
   Считаем и по завершённым (факт задержки), и по открытым просроченным
   (прогнозная задержка на сегодня) — как и в computeRisk(). */
function delayHistogram(){
  const buckets = { onTime:0, minor:0, major:0 };
  DATA.forEach(p=>p.subtasks.forEach(s=>{
    const plan = parseRuDate(s.due_plan);
    if(!plan) return;
    const done = STATUS_DONE.includes(s.status);
    const actual = parseRuDate(s.due_actual);
    let delay = null;
    if(done && actual) delay = daysBetween(actual, plan);
    else if(!done && plan < TODAY) delay = daysBetween(TODAY, plan);
    if(delay===null) return;
    if(delay<=0) buckets.onTime++;
    else if(delay<=30) buckets.minor++;
    else buckets.major++;
  }));
  return buckets;
}

/* Этап внедрения — считается из реальных данных проекта, а не задаётся
   вручную. Порог капается на "Внедрение": переход в "Масштабирование" —
   качественное решение (выход за рамки исходного пилота), для него одних
   процентов недостаточно, поэтому автоматически эта стадия не проставляется
   и остаётся на усмотрение ответственного (шаг виден в лестнице как будущий). */
function computeStageIndex(project){
  if(isProjectDone(project)) return 3; // все этапы завершены по факту — "Внедрение"
  const pct = progressPct(project);
  if(pct <= 0) return 0;   // Инициация
  if(pct <= 30) return 1;  // Пилот / прототип
  if(pct <= 65) return 2;  // Тестирование
  return 3;                // Внедрение
}
function computeStagePillLabel(project){
  if(isProjectDone(project)) return 'Готово';
  return progressPct(project) > 0 ? 'Финализация' : 'Инициация';
}
function renderStageLadder(pp, project){
  if(pp.stagePill){
    return `<div class="pill s-inprogress" style="display:inline-flex;">${computeStagePillLabel(project)}</div>`;
  }
  const idx = computeStageIndex(project);
  return `<div class="stage-ladder">${STAGE_LADDER.map((name,i)=>{
    const cls = i < idx ? 'filled' : (i===idx ? 'current' : '');
    return `<div class="stage-step ${cls}"><div class="stage-dot"></div><div class="stage-name">${name}</div></div>`;
  }).join('')}</div>`;
}

/* ===================== ПАСПОРТ ИНИЦИАТИВЫ =====================
   Паспорт собирается из трёх слоёв, каждый следующий перекрывает прежний:
   1) автоматически из данных таблицы — этапы, прогресс, сроки, риск;
   2) готовые тексты из PASSPORTS выше — для первых одиннадцати проектов;
   3) лист «Паспорта» в таблице — эффект, риски и сроки, которые ответственный
      описывает сам. Поэтому новый проект не остаётся с пустым паспортом. */
function ruDateStr(d){
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}

/* Типовой эффект по направлению проекта. Это не оценка, а осмысленная
   заготовка: у каждого направления портфеля есть характерный эффект, и
   пустая строка «не описан» хуже, чем помеченный как черновик вариант,
   который ответственный уточняет или заменяет в листе «Паспорта». */
const AUTO_EFFECTS = {
  sed_ai:        { type:'Экономия времени',  desc:'Сокращение времени на подготовку, поиск и маршрутизацию документов за счёт автоматизации рутинных операций' },
  dashboards:    { type:'Качество решений',  desc:'Единая актуальная картина вместо ручного сведения таблиц; быстрее подготовка отчётности' },
  presentations: { type:'Экономия времени',  desc:'Сокращение времени подготовки материалов и единое качество оформления' },
  telephony:     { type:'Экономия времени',  desc:'Снижение нагрузки на секретариат и операторов при первичной обработке звонков' },
  other:         { type:'Экономия времени',  desc:'Сокращение ручных операций и сроков выполнения процесса, который автоматизируется проектом' }
};

const RISK_WORDS = /риск|задерж|ожида|не получ|нет доступа|блок|зависит|перенос|перенес|не хватает|отсутству|проблем|сложн/i;

/* Риски по данным таблицы: заметки к незавершённым этапам, где говорится о
   задержках и ожиданиях, плюс полнота данных. Сроки и отставание отдельно
   выводятся ниже списком причин, здесь их не повторяем. */
function autoRisks(project){
  const parts = [];
  const notes = [];
  const open = (project.subtasks || []).filter(function(s){ return !STATUS_DONE.includes(s.status); });
  open.forEach(function(s){
    const raw = s.notes == null ? '' : String(s.notes).trim();
    if (!raw || /^[\d\s.,%]+$/.test(raw)) return;                 // «90%» — не текст
    raw.split(/[.!?]+\s+/).forEach(function(sent){
      sent = sent.trim().replace(/[.!?]+$/, '');
      if (sent.length > 8 && RISK_WORDS.test(sent)) notes.push({ stage: s.name, text: sent });
    });
  });
  notes.slice(0, 2).forEach(function(n){
    const t = n.text.length > 150 ? n.text.slice(0, 147).trim() + '…' : n.text;
    parts.push('По этапу «' + n.stage + '»: ' + t.charAt(0).toLowerCase() + t.slice(1) + '.');
  });
  const all = project.subtasks || [];
  const noDate = all.filter(function(s){ return !parseRuDate(s.due_plan); }).length;
  if (all.length && noDate) parts.push('У ' + noDate + ' из ' + all.length + ' этапов не указаны плановые сроки, поэтому оценка срока проекта неполная.');
  const noOwner = open.filter(function(s){ return !s.owner; }).length;
  if (noOwner){
    const one = noOwner % 10 === 1 && noOwner % 100 !== 11;
    parts.push('У ' + noOwner + (one ? ' незавершённого этапа не назначен ответственный.' : ' незавершённых этапов не назначен ответственный.'));
  }
  if (!parts.length) parts.push('Существенных рисков по данным таблицы не выявлено.');
  return parts.join(' ');
}

function autoPassport(project){
  const st = project.subtasks || [];
  const done = st.filter(function(s){ return STATUS_DONE.includes(s.status); }).length;
  const starts = st.map(function(s){ return parseRuDate(s.start); }).filter(Boolean);
  const plans  = st.map(function(s){ return parseRuDate(s.due_plan); }).filter(Boolean);
  let tl = 'Этапов: ' + st.length + ', завершено: ' + done + '.';
  if (starts.length) tl += ' Начало: ' + ruDateStr(new Date(Math.min.apply(null, starts))) + '.';
  if (plans.length)  tl += ' Плановое завершение: ' + ruDateStr(new Date(Math.max.apply(null, plans))) + '.';
  else tl += ' Плановые сроки этапов пока не указаны.';
  const eff = AUTO_EFFECTS[categoryKeyFor(project)] || AUTO_EFFECTS.other;
  return {
    kpis: [],
    effects: [{ type: eff.type, desc: eff.desc, status: 'нет оценки', auto: true }],
    risks: autoRisks(project),
    timeline: tl
  };
}

function sheetPassport(id){
  const rows = PASSPORT_ROWS.filter(function(r){ return String(r.n) === String(id); });
  if (!rows.length) return null;
  const pp = { effects: [], risks: '', timeline: '', ai: false };
  rows.forEach(function(r){
    /* Пометка «ИИ …» в колонке «Источник»: черновик составила модель, человек его
       ещё не проверил. Стёр пометку — метка в портале исчезает. */
    const fromAi = /^\s*(ИИ|AI)(?![A-Za-zА-Яа-яЁё])/i.test(String(r.src || ''));
    if (r.etype || r.edesc){
      pp.effects.push({ type: r.etype || 'Эффект', desc: r.edesc || '', status: r.estatus || 'нет оценки', ai: fromAi });
    }
    if (r.risks && !pp.risks) pp.risks = r.risks;
    if (r.timeline && !pp.timeline) pp.timeline = r.timeline;
    if (fromAi && (r.etype || r.edesc || r.risks || r.timeline)) pp.ai = true;
  });
  return pp;
}

function sheetKpis(id){
  return KPI_ROWS.filter(function(r){ return String(r.n) === String(id) && r.metric; }).map(function(r){
    return { metric: r.metric, baseline: r.baseline || null, target: r.target || null, actual: r.actual || null };
  });
}

function stagesOf(n){
  const one = n % 10 === 1 && n % 100 !== 11;
  return n + (one ? ' этапа' : ' этапов');
}
function daysWord(n){
  const a = Math.abs(n), m10 = a % 10, m100 = a % 100;
  if (m10 === 1 && m100 !== 11) return 'день';
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'дня';
  return 'дней';
}

/* Показатели, которые считаются из самой таблицы: ничего не вписывается
   вручную, поэтому они есть у любого проекта с момента появления в таблице
   и не могут разойтись с этапами. */
/* Плитки «готовность / сроки / просрочка / риск» повторяют то, что уже видно
   в карточке проекта, поэтому в паспорте выключены. Вернуть: true. */
let PASSPORT_FACTS = false;

function passportFacts(project){
  const st = project.subtasks || [];
  const total = st.length;
  const done = st.filter(function(s){ return STATUS_DONE.includes(s.status); }).length;
  const finished = isProjectDone(project);
  const pct = progressPct(project);
  const risk = computeRisk(project);
  const plans = st.map(function(s){ return parseRuDate(s.due_plan); }).filter(Boolean);
  const planEnd = plans.length ? new Date(Math.max.apply(null, plans)) : null;
  const ends = st.map(function(s){ return parseRuDate(s.due_actual) || parseRuDate(s.due_plan); }).filter(Boolean);
  const fcEnd = ends.length ? new Date(Math.max.apply(null, ends)) : null;
  const tiles = [];

  tiles.push({ l:'Готовность', v: pct + '%', s: total ? (done + ' из ' + stagesOf(total)) : 'этапы не указаны',
               tone: finished ? 'good' : '' });

  if (planEnd){
    const d = daysBetween(planEnd, TODAY);
    tiles.push({ l:'Плановое завершение', v: ruDateStr(planEnd),
      s: finished ? 'проект завершён' : (d > 0 ? 'через ' + d + ' ' + daysWord(d) : (d === 0 ? 'сегодня' : 'срок прошёл ' + (-d) + ' ' + daysWord(d) + ' назад')),
      tone: (!finished && d < 0) ? 'bad' : '' });
  } else {
    tiles.push({ l:'Плановое завершение', v:'—', s:'плановые сроки не указаны', tone:'' });
  }

  const delta = (fcEnd && planEnd) ? daysBetween(fcEnd, planEnd) : null;
  let fcSub = delta === null ? '' : (delta > 0 ? '+' + delta + ' дн. к плану' : 'в срок');
  let fcTone = delta > 30 ? 'bad' : (delta > 0 ? 'warn' : (delta === null ? '' : 'good'));
  /* Дата завершения проекта может не сдвинуться, а этап уже просрочен: зелёный
     рядом с красной «просрочкой» читается как противоречие. */
  if (!finished && delta !== null && delta <= 0 && risk.overdueOpen > 0){
    fcSub = 'в срок, но есть просроченные этапы'; fcTone = 'warn';
  }
  tiles.push({ l: finished ? 'Фактическое завершение' : 'Прогноз завершения',
    v: fcEnd ? ruDateStr(fcEnd) : '—', s: fcSub, tone: fcTone });

  const open = total - done;
  tiles.push({ l:'Просрочено этапов', v: String(risk.overdueOpen),
    s: finished ? 'проект завершён' : (open ? 'из ' + open + ((open % 10 === 1 && open % 100 !== 11) ? ' незавершённого' : ' незавершённых') : 'незавершённых нет'),
    tone: risk.overdueOpen > 0 ? 'bad' : 'good' });

  tiles.push({ l:'Уровень риска', v: RISK_LABEL[risk.level] || '—', s: 'по срокам и полноте данных',
    tone: risk.level === 's-high' ? 'bad' : (risk.level === 's-medium' ? 'warn' : 'good') });

  const c = getProjectContact(project);
  tiles.push({ l:'Ответственный', v: c ? c.name : (project.owner || '—'), s: '', tone:'' });
  return tiles;
}

function passportFactsHtml(project){
  const tiles = passportFacts(project);
  return `<div class="pp-block pp-kpi" data-facts="1">
      <div class="pp-head"><div class="pp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 1 8-8"/><path d="M12 12l4-3"/></svg></div><div class="pp-label t-label">Ключевые показатели</div></div>
      <div class="pp-facts">${tiles.map(function(t){
        return `<div class="pp-fact ${t.tone || ''}"><div class="pp-fact-l t-label">${escapeHtml(t.l)}</div><div class="pp-fact-v">${escapeHtml(t.v)}</div>${t.s ? `<div class="pp-fact-s">${escapeHtml(t.s)}</div>` : ''}</div>`;
      }).join('')}</div>

    </div>`;
}

function passportKpiHtml(pp){
  if (!pp.sheetKpis || !pp.sheetKpis.length) return '';
  return `<div class="pp-block pp-kpi">
      <div class="pp-head"><div class="pp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></div><div class="pp-label t-label">Показатели эффективности</div></div>
      ${renderKpiBlock(pp.sheetKpis)}
    </div>`;
}

function getPassport(project){
  const base = PASSPORTS[project.id] || null;
  const sheet = sheetPassport(project.id);
  const pp = Object.assign({}, autoPassport(project), base || {});
  /* Что осталось автоматическим: то, чего нет ни в готовом тексте, ни в таблице. */
  pp.sheetKpis = sheetKpis(project.id);
  pp.autoEffects = !base && !(sheet && sheet.effects.length);
  pp.autoRisks   = !base && !(sheet && sheet.risks);
  if (sheet){
    if (sheet.effects.length){ pp.effects = sheet.effects; pp.noEffect = false; }
    if (sheet.risks) pp.risks = sheet.risks;
    if (sheet.timeline) pp.timeline = sheet.timeline;
  }
  pp.auto = pp.autoEffects || pp.autoRisks;
  pp.aiDraft = !!(sheet && sheet.ai);
  return pp;
}

/* Пояснение над разделами, которые заполнены не цифрами из таблицы: что
   в паспорте написано автоматически и чего ещё ждём от ответственного. */
function passportNote(pp){
  const parts = [];
  if (pp.aiDraft){
    parts.push('Эффект, риски и сроки составлены ИИ по данным таблицы; ответственный их ещё не проверил. Этап внедрения и показатели считаются из таблицы.');
  } else if (pp.auto){
    const what = [pp.autoEffects ? 'эффект — типовая формулировка по направлению проекта' : '',
                  pp.autoRisks ? 'риски — по заметкам к этапам и данным таблицы' : ''].filter(Boolean).join('; ');
    parts.push('Паспорт заполнен автоматически: ' + what + '. Этапы, сроки и уровень риска считаются сами.');
  } else {
    parts.push('Этап внедрения считается автоматически по актуальным данным. Риски и сроки составлены по смыслу заметок к этапам — их нужно проверить с ответственным перед показом руководству.');
  }
  const waiting = [];
  if (pp.autoEffects) waiting.push('оценка эффекта (лист «Паспорта»)');
  if (!pp.sheetKpis || !pp.sheetKpis.length) waiting.push('показатели эффективности (лист «Показатели»)');
  if (waiting.length) parts.push('Ждём от ответственного: ' + waiting.join('; ') + '.');
  else if (pp.auto || pp.aiDraft) parts.push(pp.aiDraft
    ? 'Проверьте текст и сотрите пометку «ИИ» в колонке «Источник» листа «Паспорта» — метка исчезнет.'
    : 'Уточните формулировки с ответственным или впишите свои в листе «Паспорта».');
  return parts.join(' ');
}

function devChip(plan, actual, isForecast){
  const p = parseRuDate(plan), a = parseRuDate(actual);
  if(!p || !a) return '';
  const delta = daysBetween(a, p);
  const tag = isForecast ? ' (прогноз)' : '';
  if(delta <= 0) return `<span class="dev-chip dev-ontime">${(delta===0?'В срок':'Раньше на '+Math.abs(delta)+' дн.')}${tag}</span>`;
  const cls = delta > 14 ? 'dev-late-bad' : 'dev-late';
  return `<span class="dev-chip ${cls}">Отклонение +${delta} дн.${tag}</span>`;
}

const AVATAR_GRAD = [
  'linear-gradient(135deg,#0E3A5C,#3C6FA0)',
  'linear-gradient(135deg,#B5642A,#D98A4A)',
  'linear-gradient(135deg,#1E8A5D,#3FB483)',

function buildContacts(){
  const map = {};
  DATA.forEach(p=>p.subtasks.forEach(s=>{
    if(!s.owner) return;
    if(!map[s.owner]) map[s.owner] = { name:s.owner, projects:new Set() };
    map[s.owner].projects.add(p.id);
  }));
  return Object.values(map).map(c=>({
    name: c.name, email: emailFor(c.name),
    projectIds: Array.from(c.projects).sort((a,b)=>a-b)
  })).sort((a,b)=>b.projectIds.length-a.projectIds.length);
}

function initials(name){ return String(name || '').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

function getProjectContact(project){
  const ownerCount = {};
  project.subtasks.forEach(s=>{ if(s.owner) ownerCount[s.owner] = (ownerCount[s.owner]||0)+1; });
  const names = Object.keys(ownerCount);
  /* Ответственный у этапов не указан — берём того, кто записан у самой задачи. */
  const topName = names.length ? names.sort((a,b)=>ownerCount[b]-ownerCount[a])[0] : (project.owner || null);
  if(!topName) return null;
  return { name: topName, email: emailFor(topName) };
}

/* ===== ROUTER ===== */
function route(){
  const hash = location.hash;
  const pMatch = hash.match(/^#\/project\/(\d+)$/);
  const cMatch = hash.match(/^#\/category\/([a-z_]+)$/);
  const oMatch = hash.match(/^#\/owner\/([^/]+)$/);
  const tMatch = hash.match(/^#\/tab\/([a-z]+)$/);

  if(pMatch){
    const project = DATA.find(p=>p.id === parseInt(pMatch[1]));
    if(project){ renderDetail(project); renderBottomNav(currentRootTab); document.getElementById('appScroll').scrollTo(0,0); return; }
  }
  if(cMatch){ currentRootTab='categories'; renderCategoryList(cMatch[1]); renderBottomNav('categories'); document.getElementById('appScroll').scrollTo(0,0); return; }
  if(oMatch){ currentRootTab='categories'; renderOwnerList(oMatch[1]); renderBottomNav('categories'); document.getElementById('appScroll').scrollTo(0,0); return; }
  if(hash === '#/owners'){ currentRootTab='categories'; renderOwnerGrid(); renderBottomNav('categories'); document.getElementById('appScroll').scrollTo(0,0); return; }
  if(tMatch && ROOT_TABS.find(t=>t.key===tMatch[1])){
    currentRootTab = tMatch[1];
    if(currentRootTab==='home') renderHome();
    else if(currentRootTab==='categories') renderCategoryGrid();
    else if(currentRootTab==='analytics') renderAnalytics();
    else if(currentRootTab==='more') renderMore();
    renderBottomNav(currentRootTab);
    document.getElementById('appScroll').scrollTo(0,0);
    return;
  }
  currentRootTab='home'; renderHome(); renderBottomNav('home');
}

window.addEventListener('hashchange', route);

/* Данные подтягиваются при запуске и при возврате к приложению. */
/* ---------- положение нижнего меню ----------
   В Safari меню должно стоять над нижней панелью браузера, иначе та его
   закроет, — там хватает обычной привязки. В приложении с главного экрана
   панели браузера нет, и меню опускается к полоске «домой». Режим
   определяется при запуске, высота берётся фактическая. */
function isStandalone(){
  return !!(window.navigator.standalone ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
}
function cssVar(name){
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
}
/* ---------- высота страницы в режиме приложения ----------
   Ошибка iOS 26: в приложении с главного экрана, когда шапка растянута под
   строку состояния, система занижает высоту окна ровно на верхнюю безопасную
   зону. 100%, 100dvh, innerHeight — все короче экрана; честную высоту отдаёт
   только 100lvh. Стили ставят её странице, а если браузер эту единицу
   не знает, страница дотягивается до высоты экрана здесь. */
function viewportFix(){
  if (!isStandalone() || window.innerWidth >= 760) return 0;
  const sat = cssVar('--sat');
  const screenH = (window.screen && window.screen.height) || 0;
  const missing = screenH - window.innerHeight;
  return (sat > 0 && Math.abs(missing - sat) <= 3) ? Math.round(sat) : 0;
}
function fitShell(){
  const root = document.documentElement;
  if (!isStandalone() || window.innerWidth >= 760 || window.innerWidth > window.innerHeight){
    root.style.height = '';
    return;
  }
  root.style.height = '';
  const want = (window.screen && window.screen.height) || 0;
  const got = root.getBoundingClientRect().height;
  if (want && got < want - 3) root.style.height = want + 'px';
}
function shellHeight(){ return Math.round(document.documentElement.getBoundingClientRect().height); }

if (isStandalone()) document.documentElement.classList.add('standalone');
window.addEventListener('resize', fitShell);
window.addEventListener('pageshow', fitShell);
window.addEventListener('load', function(){ fitShell(); setTimeout(fitShell, 400); });
window.addEventListener('orientationchange', function(){ setTimeout(fitShell, 250); });
fitShell();

    pullData(false).then(function(ok){ if (ok && LAST_PULL_CHANGED) rerenderCurrent(); });
  }
  /* Приложение, запущенное с главного экрана, не всегда сообщает о возврате
     одним и тем же событием, поэтому слушаем все три и не даём им сработать
     чаще раза в пять секунд. */
  let lastRefresh = Date.now();
  const refresh = function(force){
    if (!API_URL || !API_KEY) return;
    if (force !== true && Date.now() - lastRefresh < 5000) return;
    lastRefresh = Date.now();
    pullData(true).then(function(ok){ if (ok && LAST_PULL_CHANGED) rerenderCurrent(); });
  };
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); });
  window.addEventListener('pageshow', function(){ refresh(); });
  window.addEventListener('focus', function(){ refresh(); });
  /* Связь вернулась — сразу обновляемся, не дожидаясь следующего повода. */
  window.addEventListener('online', function(){ refresh(true); });
  /* Пока приложение открыто, подтягиваем чужие изменения раз в минуту.
     Экран перерисовывается только если что-то действительно изменилось. */
  setInterval(function(){ if (!document.hidden) refresh(); }, 60000);
  window.manualRefresh = function(){ refresh(true); };

  /* ---------- жест «потянуть вниз» ---------- */
  const scroller = document.getElementById('appScroll');
  const ptr = document.getElementById('ptr');
  /* К высоте раскрытия прибавляем безопасную зону: иначе кружок окажется
     под вырезом или островком, где его не видно. */
  const SAT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  const OPEN = 52 + SAT, TRIGGER = 58 + SAT, MAX = 100 + SAT;
  let startY = 0, pulling = false, busy = false;

  function setHeight(px){ ptr.style.height = px + 'px'; }

  async function runRefresh(){
    if (busy) return;
    busy = true;
    ptr.classList.remove('drag');
    ptr.classList.add('ready', 'spin');
    setHeight(OPEN);
    lastRefresh = 0;
    const ok = await pullData(true);
    if (ok && LAST_PULL_CHANGED) rerenderCurrent();
    if (!ok){ syncBadge('Нет связи с таблицей', false); syncHide(2400); }
    /* Небольшая задержка: мгновенное схлопывание читается как сбой. */
    setTimeout(function(){
      setHeight(0);
      ptr.classList.remove('spin');
      setTimeout(function(){ ptr.classList.remove('ready'); busy = false; }, 300);
    }, ok ? 420 : 900);
  }

  scroller.addEventListener('touchstart', function(e){
    if (busy || scroller.scrollTop > 0) { pulling = false; return; }
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive: true });

  scroller.addEventListener('touchmove', function(e){
    if (!pulling || busy) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0){ ptr.classList.remove('drag','ready'); setHeight(0); return; }
    /* Сопротивление: чем дальше тянут, тем медленнее идёт. */
    const d = Math.min(MAX, dy * 0.55);
    ptr.classList.add('drag');
    setHeight(d);
    ptr.classList.toggle('ready', d > 24);
    if (d > 6 && e.cancelable) e.preventDefault();
  }, { passive: false });

  scroller.addEventListener('touchend', function(){
    if (!pulling || busy) return;
    pulling = false;
    const h = parseFloat(ptr.style.height) || 0;
    ptr.classList.remove('drag');
    if (h >= TRIGGER) runRefresh();
    else { setHeight(0); setTimeout(function(){ ptr.classList.remove('ready'); }, 300); }
  });

  /* Повторное нажатие на активную вкладку — тот же индикатор, тот же результат. */
  window.manualRefresh = runRefresh;
})();

/* ===== INIT: светлая тема по умолчанию =====
   Системная тема телефона не учитывается: портал всегда открывается светлым.
   Тёмная включается только тем, кто выбрал её сам в разделе «Ещё»; выбор хранится
   под новым именем, поэтому прежние автоматические значения его не включают. */
(function initAppearance(){
  let savedMode = null, savedTheme = null;
  try{ savedMode = localStorage.getItem('kmm_mode_pick'); savedTheme = localStorage.getItem('kmm_theme'); }catch(e){}
  if(savedMode !== 'dark') savedMode = 'light';
  currentMode = savedMode;
  document.documentElement.setAttribute('data-theme', currentMode);
  if(savedTheme && THEMES.find(t=>t.key===savedTheme)) activeTheme = savedTheme;
  const t = THEMES.find(x=>x.key===activeTheme) || THEMES[0];
  const accent = (currentMode==='dark' && t.accentDark) ? t.accentDark : t.accent;
  const tint = currentMode==='dark' ? hexToRgba(accent, 0.16) : t.tint;
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-tint', tint);
})();

/* ===== INIT: restore previously imported Excel data, if any ===== */
(function initData(){
  try{
    const saved = localStorage.getItem('kmm_data');
    const savedAt = localStorage.getItem('kmm_data_imported_at');
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length){
        DATA = parsed;
        dataSource = 'imported';
        dataImportedAt = savedAt || null;
      }
    }
  }catch(e){}
})();

route();
</script>
